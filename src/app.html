<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>trace — app</title>
<!--FONT-->
<!--CSS-->
<script>
/* Theme, before first paint. INK is the app and the default; PAPER is the
   second ground, and also what the whole screen becomes when their trace
   arrives. "auto" means no attribute at all, so the CSS media query decides.
   Runs here rather than in app.js because a stamped attribute after paint is
   a flash.

   'dark' is accepted and maps to ink: it is what the preference was called
   before the inversion, and a stored value has to keep working. */
(function(){
  var K='trace:theme';
  var PAPER='#FBFAFB', INK='#08070A';
  /* the query asks about LIGHT now, because ink is the default and only a
     light phone should move us off it */
  var os = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function norm(p){ return p==='paper' ? 'paper' : p==='auto' ? 'auto' : 'ink'; }
  /* The OS paints its chrome from theme-color, so the preference has to reach
     it too — otherwise picking Paper leaves a black bar above a white app. */
  function chrome(p){
    var paper = p==='paper' || (p==='auto' && !!(os && os.matches));
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', paper ? PAPER : INK);
  }
  function apply(p){
    p = norm(p);
    if(p==='auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', p==='paper' ? 'light' : 'dark');
    chrome(p);
  }
  /* on "match phone", the OS can change under us */
  if(os && os.addEventListener) os.addEventListener('change',function(){
    var p; try{ p=norm(localStorage.getItem(K)); }catch(e){ p='ink'; }
    if(p==='auto') chrome(p);
  });
  var pref='ink';
  try{ pref=localStorage.getItem(K)||'ink'; }catch(e){}
  apply(pref);
  window.TRACE_THEME={
    get:function(){ try{ return norm(localStorage.getItem(K)); }catch(e){ return 'ink'; } },
    set:function(p){
      try{ localStorage.setItem(K,p); }catch(e){}
      apply(p);
      /* strokes name a palette slot and resolve per device, so a flip needs
         the token cache dropped and a repaint — nothing stored changes */
      window.dispatchEvent(new Event('themechange'));
      window.dispatchEvent(new Event('resize'));
    }
  };
})();
</script>
</head>
<body>
<!--SPRITE-->

<div id="stage">
<div id="phone">
<div id="screen" data-room="Canvas">

  <!-- ============ her home screen — frame 21b ============ -->
  <div id="home">
    <div id="home-time">9:41 · tuesday</div>

    <button id="widget" title="open trace">
      <span id="widget-brand">TRACE</span>
      <span id="widget-body"></span>
      <canvas id="widget-ink"></canvas>
      <span id="widget-cap"></span>
      <span id="widget-dots"></span>
    </button>

    <div id="home-grid">
      <div class="apptile"></div><div class="apptile"></div>
      <div class="apptile"></div><div class="apptile"></div>
      <div class="apptile"></div><div class="apptile"></div>
      <div class="apptile"></div>
      <div class="apptile trace">
        <svg viewBox="0 0 120 120" style="width:38px;height:38px">
          <path d="M18 82 C42 26,66 96,102 34" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/>
          <circle cx="102" cy="34" r="8" fill="#1A1A1A"/>
        </svg>
      </div>
    </div>

    <div id="home-hint">Her board, on your home screen.<br>Tap the widget to slide it.</div>
    <div id="home-dock"><div></div><div></div><div></div><div></div></div>
  </div>

  <!-- ==================== the app ==================== -->
  <div id="appview" class="hidden">
    <div id="sky"></div>
    <!-- The ambient field: the drawing's own light, diffused through the room.
         Blur alone is fog — glass is refraction, and refraction needs a lit,
         coloured field to bend. Three blooms on one 26s loop, under a veil
         that keeps every text contrast honest. -->
    <div id="field" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
    <div id="veil" aria-hidden="true"></div>
    <div id="dim"></div>

    <div id="col">
      <div id="stack">

        <!-- ---------- Canvas — 19b + 20a ---------- -->
        <section class="scr" id="sc-canvas">
          <div class="hd">
            <div class="pill" id="presence">
              <span class="dot" id="presence-dot"></span>
              <span id="presence-txt">Maya is here</span>
              <span id="presence-ico" hidden><svg class="ts-i"><use href="#i-pencil"/></svg></span>
            </div>
            <button class="icob" id="to-board" title="your board">⤴</button>
          </div>

          <div class="title">
            <div class="k">Today’s canvas</div>
            <div class="v" id="canvas-count">0 marks, 0 hands</div>
          </div>

          <div class="pagerow"></div>

          <div id="canvas-zone">
            <div id="canvas-wrap">
              <div id="card-sky"></div>
              <div id="card-light"></div>
              <canvas id="ink"></canvas>
              <div id="ghost-finger"><span>her finger</span></div>
              <div id="mirror-line"></div>
              <div id="warm-layer"></div>
              <div id="bloom"></div>
              <div id="whisper"></div>
              <div id="canvas-tag">Sara</div>
              <div id="canvas-note"></div>
            </div>
          </div>

          <div class="stat2">
            <div><div class="k">Goodnight in</div><div class="v" id="st-goodnight">2h 14m</div></div>
            <div><div class="k">Streak</div><div class="v" id="st-streak">41 days</div></div>
          </div>

          <div id="dock">
            <div class="dock-row" id="brushes">
              <button class="tool is-on" data-brush="pen" title="pen"><svg class="ts-i"><use href="#i-pencil"/></svg></button>
              <button class="tool" data-brush="spark" title="sparkles"><svg class="ts-i"><use href="#i-sparkles"/></svg></button>
              <button class="tool" data-brush="zap" title="zap"><svg class="ts-i"><use href="#i-zap"/></svg></button>
              <button class="tool" data-brush="marker" title="marker"><svg class="ts-i"><use href="#i-marker"/></svg></button>
              <button class="tool" data-brush="hi" title="highlighter"><svg class="ts-i"><use href="#i-highlighter"/></svg></button>
              <button class="tool" data-brush="ghost" title="invisible ink"><svg class="ts-i"><use href="#i-ghost"/></svg></button>
              <button class="tool" data-brush="eraser" title="eraser"><svg class="ts-i"><use href="#i-eraser"/></svg></button>
            </div>
            <div class="dock-row">
              <button class="rbtn" id="undo-btn" title="undo"><svg class="ts-i"><use href="#i-undo"/></svg></button>
              <div id="colors">
                <button class="swatch is-on" data-c="red" style="--sw:var(--red)"></button>
                <button class="swatch" data-c="ink" style="--sw:var(--ink)"></button>
                <button class="swatch" data-c="amber" style="--sw:var(--amber)"></button>
                <button class="swatch" data-c="violet" style="--sw:var(--violet)"></button>
              </div>
              <button class="rbtn hot" id="heart-btn" title="heartbeat"><svg class="ts-i"><use href="#i-heart-fill"/></svg></button>
            </div>
          </div>
        </section>

        <!-- ---------- Rooms directory — 19c ---------- -->
        <section class="scr hidden" id="sc-rooms">
          <div class="hd">
            <div style="width:36px"></div>
            <div style="font-size:17px;font-weight:600">Rooms</div>
            <button class="icob" data-back>✕</button>
          </div>
          <div class="search">
            <input id="room-search" placeholder="Search 60 features" autocomplete="off">
            <span>⌕</span>
          </div>
          <div class="body" id="rooms-list"></div>
        </section>

        <!-- ---------- a room — 19d / 19f / 19g / 19h / 19i ---------- -->
        <section class="scr hidden" id="sc-room"></section>

        <!-- ---------- your board — 21a ---------- -->
        <section class="scr hidden" id="sc-board"></section>

        <!-- ---------- every widget state — 21c ---------- -->
        <section class="scr hidden" id="sc-states"></section>

        <!-- ---------- rules — 19j ---------- -->
        <section class="scr hidden" id="sc-rules"></section>

        <!-- ---------- every surface — 24a / 22b / 22c / 24i ---------- -->
        <section class="scr hidden" id="sc-surfaces"></section>
      </div>

      <!-- the one control bar — 19b/19c/19d, verbatim -->
      <div id="controlbar">
        <button class="cb" id="cb-left" title="pen">✎</button>
        <button id="cb-room">Canvas</button>
        <button class="cb" id="cb-right" title="rules">⚙</button>
      </div>
    </div>

    <!-- feature directory sheet (all 57 legacy features, searchable) -->
    <div id="sheet" class="hidden">
      <div id="sheet-card">
        <div class="grab"></div>
        <div id="sheet-list"></div>
      </div>
    </div>

    <!-- feature overlay panel -->
    <div id="panel" class="hidden">
      <div id="panel-bar">
        <button id="panel-close">✕</button>
        <div id="panel-title">feature</div>
        <div id="panel-aux"></div>
      </div>
      <div id="panel-body"></div>
    </div>

    <!-- kept for the engine; the clean system has no streak pill or tab strip -->
    <div id="tabs"><button data-p="us" class="tb on">us</button></div>
    <div id="streakpill"><b id="streak-n">41</b></div>
    <div id="wordmark">trace</div>
    <button id="more-btn" hidden>⋯</button>
  </div>

  <div id="statusbar">
    <span id="clock">9:41</span>
    <span class="sb-r">
      <svg id="sb-cell" viewBox="0 0 18 12" aria-label="cellular"><g fill="currentColor">
        <rect x="0"  y="8" width="3" height="4"  rx="1"/>
        <rect x="5"  y="6" width="3" height="6"  rx="1"/>
        <rect x="10" y="3" width="3" height="9"  rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1" class="cb4"/>
      </g></svg>
      <svg id="sb-wifi" viewBox="0 0 16 12" aria-label="wifi">
        <path class="w1" d="M8 10.6 L9.8 8.8 A2.6 2.6 0 0 0 6.2 8.8 Z" fill="currentColor"/>
        <path class="w2" d="M4.4 7 A5.2 5.2 0 0 1 11.6 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path class="w3" d="M1.9 4.4 A8.6 8.6 0 0 1 14.1 4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <line class="wx" x1="2.5" y1="1.5" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0"/>
      </svg>
      <span id="sb-batt"><i id="sb-batt-fill"></i></span>
    </span>
  </div>
  <button id="draw-count">0 marks</button>
  <button id="draw-done">Done<span style="opacity:.6">✓</span></button>
  <button id="home-bar" title="home"></button>
  <div id="toast"></div>
</div>
</div>

<aside id="sim">
  <div class="sim-head">SIMULATION · SARA'S SIDE</div>
  <div id="sim-log"></div>
  <div class="sim-actions">
    <button data-sim="draw">she draws something</button>
    <button data-sim="heart">she sends a heartbeat</button>
    <button data-sim="open">she opens the canvas</button>
    <button data-sim="tug">she tugs the string</button>
  </div>
</aside>
</div>

<!--JS-->
</body>
</html>
