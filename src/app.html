<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>trace — app simulation</title>
<!--FONT-->
<!--CSS-->
</head>
<body>
<!--SPRITE-->

<div id="stage">
<div id="phone">
  <div id="screen">
    <div id="sky"></div>
    <div id="vignette"></div>

    <div id="statusbar"><span id="clock">9:41</span><span class="sb-r">▮▮▮</span></div>

    <header id="top">
      <div id="wordmark" title="hold for settings">tra<span>ce</span></div>
      <div id="streakpill"><svg class="ts-i"><use href="#i-flame"/></svg><b id="streak-n">128</b></div>
      <div id="presence" class="glass">
        <span id="presence-dot"></span><span id="presence-txt">with Sara</span>
      </div>
    </header>

    <main id="canvas-wrap">
      <canvas id="ink"></canvas>
      <div id="ghost-finger"><span>her finger</span></div>
      <div id="canvas-note"></div>
      <div id="whisper"></div>
      <div id="mirror-line"></div>
      <div id="warm-layer"></div>
      <div id="bloom"></div>
    </main>

    <div id="dock" class="glass">
      <div class="dock-row" id="brushes">
        <button class="tool is-on" data-brush="pen" title="pen"><svg class="ts-i"><use href="#i-pencil"/></svg></button>
        <button class="tool" data-brush="spark" title="sparkles"><svg class="ts-i"><use href="#i-sparkles"/></svg></button>
        <button class="tool" data-brush="zap" title="zap"><svg class="ts-i"><use href="#i-zap"/></svg></button>
        <button class="tool" data-brush="marker" title="marker"><svg class="ts-i"><use href="#i-marker"/></svg></button>
        <button class="tool" data-brush="ghost" title="invisible ink"><svg class="ts-i"><use href="#i-ghost"/></svg></button>
      </div>
      <div class="dock-row">
        <button class="swatch is-on" data-c="#e23343" style="background:#e23343"></button>
        <button class="swatch" data-c="#ff7a9c" style="background:#ff7a9c"></button>
        <button class="swatch" data-c="#f3f0f4" style="background:#f3f0f4"></button>
        <button class="swatch" data-c="#f4c66b" style="background:#f4c66b"></button>
        <button class="swatch" data-c="#7ec8ff" style="background:#7ec8ff"></button>
        <span class="dock-sep"></span>
        <button class="rbtn hot" id="heart-btn" title="heartbeat"><svg class="ts-i"><use href="#i-heart-fill"/></svg></button>
        <button class="rbtn" id="undo-btn" title="undo"><svg class="ts-i"><use href="#i-undo"/></svg></button>
        <button class="rbtn" id="more-btn" title="everything">⋯</button>
      </div>
    </div>

    <!-- feature sheet -->
    <div id="sheet" class="hidden">
      <div id="sheet-card" class="glass">
        <div class="grab"></div>
        <div id="sheet-list"></div>
      </div>
    </div>

    <!-- feature overlay panel -->
    <div id="panel" class="hidden">
      <div id="panel-bar">
        <button id="panel-close">✕</button>
        <div id="panel-title">feature</div>
        <div id="panel-aux"></div>
      </div>
      <div id="panel-body"></div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<aside id="sim">
  <div class="sim-head">SIMULATION · SARA'S SIDE</div>
  <div id="sim-log"></div>
  <div class="sim-actions">
    <button data-sim="draw">she draws something</button>
    <button data-sim="heart">she sends a heartbeat</button>
    <button data-sim="open">she opens the canvas</button>
    <button data-sim="tug">she tugs the string</button>
  </div>
</aside>
</div>

<!--JS-->
</body>
</html>
