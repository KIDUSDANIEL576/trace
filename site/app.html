<style>
/* trace — app, on the Trace Paper system (Trace Paper.dc.html, p1–p61).
   Bright paper: warm off-white grounds, near-black ink, one red accent.
   Phone 390×844 r46 with an 8px #1A1A1A bezel and a 0 24px 50px shadow.
   Dark surfaces are inversions for emphasis, not a dark mode — dark mode is
   the separate token block under [data-theme="dark"], with its own values. */

/* ============================================================ tokens */
:root{
  /* grounds */
  --ground:#FBF4EA;          /* paper — default screen background */
  --ground-alt:#F2EADC;      /* paper-alt — quiet screens (repair, grief, the end) */
  --ground-deep:#EFE6D6;     /* paper-deep — grief only */
  --stage:#F2EADC;           /* behind the device */

  /* surfaces */
  --surface:#FFFFFF;         /* card — cards, rows, list items */
  --surface-2:#FFFFFF;       /* chips, pills, icon buttons */
  --hairline:rgba(26,26,26,.1);
  --divider:rgba(26,26,26,.08);
  --dashed:rgba(26,26,26,.2);

  /* ink */
  --ink:#1A1A1A;
  --ink-2:rgba(26,26,26,.55);
  --ink-3:rgba(26,26,26,.45);
  --ink-4:rgba(26,26,26,.4);
  --ink-5:rgba(26,26,26,.3);

  /* the one accent */
  --red:#E23343;
  --red-text:#B3202E;        /* red-deep — red text on paper, contrast-safe */
  --red-wash:rgba(226,51,67,.1);
  --red-line:rgba(226,51,67,.35);
  --on-red:#FFFFFF;

  /* the inverted card — emphasis, not a theme */
  --emph:#1A1A1A;
  --emph-ink:#FBF4EA;        /* cream */
  --emph-ink-2:rgba(251,244,234,.75);
  --emph-ink-3:rgba(251,244,234,.6);
  --emph-ink-4:rgba(251,244,234,.45);
  --emph-red:#E9808A;        /* red-light — red text on ink */
  --emph-line:rgba(251,244,234,.16);

  /* rare third accent, and the pen palette */
  --amber:#E9A13B;
  --violet:#7A6BB5;

  --bezel:#1A1A1A;
  --device-shadow:0 24px 50px rgba(26,26,26,.22);
  --scrim:rgba(26,26,26,.45);
}

/* Dark mode is a preference, not the design. It is not an inversion of
   paper — it is the same structure with its own warm near-black values, so
   the ink card stays an emphasis step rather than blending into the ground. */
:root[data-theme="dark"]{
  --ground:#15120E;
  --ground-alt:#1B1713;
  --ground-deep:#100E0B;
  --stage:#0E0C0A;

  --surface:#211C17;
  --surface-2:#292219;
  --hairline:rgba(245,239,228,.12);
  --divider:rgba(245,239,228,.09);
  --dashed:rgba(245,239,228,.22);

  --ink:#F5EFE4;
  --ink-2:rgba(245,239,228,.6);
  --ink-3:rgba(245,239,228,.5);
  --ink-4:rgba(245,239,228,.42);
  --ink-5:rgba(245,239,228,.3);

  --red:#F04A58;
  --red-text:#FF8A92;
  --red-wash:rgba(240,74,88,.14);
  --red-line:rgba(240,74,88,.4);
  --on-red:#15120E;

  --emph:#F5EFE4;
  --emph-ink:#15120E;
  --emph-ink-2:rgba(21,18,14,.75);
  --emph-ink-3:rgba(21,18,14,.6);
  --emph-ink-4:rgba(21,18,14,.45);
  --emph-red:#B3202E;
  --emph-line:rgba(21,18,14,.16);

  --amber:#E9A13B;
  --violet:#9C8BD8;

  --bezel:#2A241D;
  --device-shadow:0 24px 50px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
}

/* Follow the OS only when the user has not picked. An explicit choice
   stamps data-theme on <html> and wins in both directions. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --ground:#15120E;--ground-alt:#1B1713;--ground-deep:#100E0B;--stage:#0E0C0A;
    --surface:#211C17;--surface-2:#292219;
    --hairline:rgba(245,239,228,.12);--divider:rgba(245,239,228,.09);--dashed:rgba(245,239,228,.22);
    --ink:#F5EFE4;--ink-2:rgba(245,239,228,.6);--ink-3:rgba(245,239,228,.5);
    --ink-4:rgba(245,239,228,.42);--ink-5:rgba(245,239,228,.3);
    --red:#F04A58;--red-text:#FF8A92;--red-wash:rgba(240,74,88,.14);
    --red-line:rgba(240,74,88,.4);--on-red:#15120E;
    --emph:#F5EFE4;--emph-ink:#15120E;--emph-ink-2:rgba(21,18,14,.75);
    --emph-ink-3:rgba(21,18,14,.6);--emph-ink-4:rgba(21,18,14,.45);
    --emph-red:#B3202E;--emph-line:rgba(21,18,14,.16);
    --violet:#9C8BD8;--bezel:#2A241D;
    --device-shadow:0 24px 50px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);
  }
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);overflow:hidden;
  font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}
.hand{font-family:Caveat,'Segoe Script',cursive;font-weight:700}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:26px;padding:10px}

/* --------------------------------------------------- phone — p2, verbatim */
#phone{width:390px;height:844px;border-radius:46px;border:8px solid var(--bezel);flex:none;
  box-shadow:var(--device-shadow);overflow:hidden;position:relative;background:var(--ground)}
#screen{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}

#statusbar{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:16px 28px 0;font-size:15px;font-weight:600;pointer-events:none;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.sb-r{display:flex;align-items:center;gap:7px;opacity:.9}
#sb-cell{width:19px;height:12px;color:var(--ink)}
#sb-cell .cb4{opacity:.3}
#sb-wifi{width:17px;height:12px;color:var(--ink);transition:opacity .3s}
#sb-wifi.off .w1,#sb-wifi.off .w2,#sb-wifi.off .w3{opacity:.28}
#sb-wifi.off .wx{opacity:1}
#sb-batt{width:25px;height:12.5px;border:1px solid var(--ink-4);border-radius:4px;position:relative;display:inline-block}
#sb-batt::after{content:'';position:absolute;right:-3.5px;top:3.5px;width:2px;height:5px;
  border-radius:0 2px 2px 0;background:var(--ink-4)}
#sb-batt-fill{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:80%;border-radius:2px;background:var(--ink);
  display:block;transition:width 1s,background .4s}
#sb-batt.low #sb-batt-fill{background:var(--red)}
#home-bar{position:absolute;z-index:31;bottom:12px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:var(--ink-5);border:0;padding:0}

/* ------------------------------------------- her home screen — p16 (widget) */
#home{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ground-alt)}
#widget{position:relative;margin:64px 20px 0;height:178px;border-radius:26px;overflow:hidden;
  background:var(--surface);border:1px solid var(--hairline);
  box-shadow:0 8px 24px rgba(26,26,26,.08);text-align:left;display:block;width:calc(100% - 40px)}
#widget:active{transform:scale(.985)}
#widget-brand{position:absolute;top:13px;right:16px;font-size:10px;letter-spacing:.16em;color:var(--ink-4);z-index:2}
#widget-body{position:absolute;inset:0;padding:16px 18px}
#widget-ink{position:absolute;left:18px;right:18px;top:44px;height:74px;width:calc(100% - 36px)}
#widget-cap{position:absolute;left:18px;right:18px;bottom:26px;font-size:11px;color:var(--ink-3)}
#widget-cap i{font-style:normal}
#widget-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
#widget-dots span{width:5px;height:5px;border-radius:50%;background:var(--ink-5);transition:background .2s}
#widget-dots span.on{background:var(--red)}
.w-live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500}
.w-live b{width:6px;height:6px;border-radius:50%;animation:pulseDot 2.4s ease-in-out infinite}
.w-kicker{font-size:12px;font-weight:500;color:var(--ink-2)}
.w-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.w-tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-5);display:inline-flex;
  align-items:center;justify-content:center;font-size:11px;color:var(--on-red);flex:none}
.w-tick.done{border-color:var(--red);background:var(--red)}
.w-row span{font-size:15px}
.w-row span.off{opacity:.45;text-decoration:line-through}
.w-foot{font-size:11px;color:var(--ink-3);margin-top:12px}
.w-cal{display:flex;gap:16px;align-items:center;height:100%}
.w-cal .d{text-align:center;padding:0 6px}
.w-cal .d i{font-style:normal;font-size:12px;color:var(--red);font-weight:600;display:block}
.w-cal .d b{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1;display:block}
.w-cal .rule{width:1px;align-self:stretch;background:var(--divider)}
.w-cal .items{flex:1}
.w-cal .items p{margin:0 0 8px;font-family:Caveat,cursive;font-weight:700;font-size:23px;line-height:1.2}
.w-mid{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.w-orb{width:44px;height:44px;border-radius:50%;background:var(--red);
  box-shadow:0 0 34px var(--red-wash);animation:pulseDot 2.6s ease-in-out infinite}
.w-mid b{font-size:16px;font-weight:600}
.w-mid i{font-style:normal;font-size:11px;color:var(--ink-3)}
.w-big{font-size:26px;font-weight:700;margin-top:2px}
.w-note{font-family:Caveat,cursive;font-weight:700;font-size:26px;margin-top:4px}

#home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding:28px 26px 0;justify-items:center}
.apptile{width:60px;height:60px;border-radius:15px;background:var(--surface);border:1px solid var(--hairline)}
.apptile.trace{background:var(--red);border-color:transparent;
  display:flex;align-items:center;justify-content:center}
#home-hint{margin-top:auto;padding:0 30px 12px;font-size:13px;line-height:1.5;color:var(--ink-4);text-align:center}
#home-dock{margin:0 22px 30px;height:84px;border-radius:28px;background:var(--surface);
  border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-around;padding:0 10px}
#home-dock div{width:58px;height:58px;border-radius:15px;background:var(--ground-alt)}
#home-time{display:none}

/* ------------------------------------------------------------- the app body */
#appview{position:absolute;inset:0;display:flex;flex-direction:column}
#sky{position:absolute;inset:0;transition:background .6s ease,filter 1.2s ease;background:var(--ground)}
#sky.warm{filter:saturate(1.04) brightness(1.01)}
/* rooms tint the paper, they do not change it. p46/p51 use paper-alt, p54 paper-deep. */
#screen[data-room="Canvas"]    #sky{background:var(--ground)}
#screen[data-room="Household"] #sky{background:var(--ground)}
#screen[data-room="Memory"]    #sky{background:var(--ground-alt)}
#screen[data-room="Wellbeing"] #sky{background:var(--ground-alt)}
#dim{position:absolute;inset:0;pointer-events:none;background:transparent}
#col{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:46px}

#stack{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scr.hidden{display:none!important}

/* the one header shape every room shares — p2/p6/p7 */
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0;flex:none}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--hairline);font-size:13px;font-weight:500;color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulseDot 2.4s ease-in-out infinite}
.icob{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;color:var(--ink)}
.icob:active{transform:scale(.93)}
.title{padding:24px 26px 0;flex:none;text-align:center}
.title .k{font-size:14px;color:var(--ink-3)}
.title .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.05}
.title .s{font-size:14px;color:var(--ink-3);margin-top:6px}
.eyebrow{padding:20px 24px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);flex:none}
.body{flex:1;min-height:0;padding:16px 20px 0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;
  overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26px);
  mask-image:linear-gradient(180deg,transparent 0,#000 26px)}
.body::-webkit-scrollbar{display:none}
.foot{padding:14px 24px 20px;font-size:13px;color:var(--ink-4);text-align:center;flex:none}

/* the row — one shape for tasks, items, rooms, switches */
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;
  background:var(--surface);border:1px solid var(--hairline);text-align:left;width:100%;flex:none;color:var(--ink)}
.row:active{transform:scale(.99)}
.row .grow{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;display:block}
.row .n.light{font-weight:500}
.row .s{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.row .s.big{font-size:13px;color:var(--ink-2);margin-top:1px}
.row .cnt{font-size:15px;font-weight:600}
.row .chev{font-size:16px;color:var(--ink-4)}
.row.on{background:var(--red-wash);border-color:var(--red-line)}
/* p6: the room glyph sits on a filled tile — red for the canvas, ink for
   everything else. Nothing else in the directory is allowed colour. */
.ico{width:38px;height:38px;border-radius:12px;background:var(--ground-alt);display:flex;align-items:center;
  justify-content:center;font-size:17px;flex:none}
.ico.ink{background:var(--emph);color:var(--emph-ink)}
.ico.red{background:var(--red);color:var(--on-red)}
.ico .ts-i{font-size:18px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-5);display:flex;
  align-items:center;justify-content:center;font-size:13px;color:var(--on-red);flex:none;transition:.15s}
.tick.on{border-color:var(--ink);background:var(--ink);color:var(--emph-ink)}
.row.done .grow{opacity:.45}
.row.done .n{text-decoration:line-through}
.who.them{background:var(--red-wash);color:var(--red-text)}
.who.free{background:var(--red);color:var(--on-red)}
.who{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ground-alt);flex:none}
.sw{width:46px;height:28px;border-radius:99px;background:rgba(26,26,26,.18);padding:3px;display:flex;
  justify-content:flex-start;transition:all .18s ease;flex:none}
:root[data-theme="dark"] .sw{background:rgba(245,239,228,.2)}
.sw i{width:22px;height:22px;border-radius:50%;background:#fff;display:block}
.sw.on{background:var(--red);justify-content:flex-end}
.sw.amber.on{background:var(--amber)}

.search{margin:18px 20px 0;height:44px;border-radius:14px;background:var(--surface);
  border:1px solid var(--hairline);display:flex;align-items:center;gap:10px;padding:0 16px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:15px inherit}
.search input::placeholder{color:var(--ink-3)}

.splitbar{margin:18px 20px 0;height:8px;border-radius:99px;background:var(--ground-alt);
  border:1px solid var(--hairline);overflow:hidden;display:flex;flex:none}
.splitbar .a{background:var(--ink)}
.splitbar .b{flex:1;background:var(--red)}

/* the two stat cards — p2, the only summary allowed on the canvas */
.stat2{display:flex;gap:10px;padding:14px 20px 0;flex:none}
.stat2>div{flex:1;padding:13px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--hairline)}
.stat2 .k{font-size:12px;color:var(--ink-3)}
.stat2 .v{font-size:21px;font-weight:700;margin-top:2px}

.deck{display:flex;gap:8px;padding:0 20px;overflow-x:auto;flex:none;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.deck .c{min-width:110px;height:64px;border-radius:14px;background:var(--surface);
  border:1px solid var(--hairline);padding:9px 11px;flex:none}
.deck .c b{font-size:13px;font-weight:600;display:block}
.deck .c i{font-style:normal;font-size:10px;color:var(--ink-3);margin-top:6px;display:block}

/* ------------------------------------------------- the canvas room — p2, p36 */
/* the composer and the brush pop both push up from the dock; the canvas may
   shrink for them but must never vanish — it is the home screen. */
#canvas-zone{flex:1;min-height:140px;display:flex;padding:20px 20px 0}
/* p14 is its own screen in the design. Here it opens over the canvas, so the
   canvas yields to a strip and the stat cards stand down — a composer needs
   the height, and neither number means anything while you are typing. */
#sc-canvas.composing #canvas-zone{min-height:0;flex:0 1 96px}
#sc-canvas.composing .stat2{display:none}
#canvas-wrap{position:relative;flex:1;border-radius:24px;overflow:hidden;background:var(--surface);
  border:1px solid var(--hairline);touch-action:none}
#card-sky{position:absolute;inset:0;opacity:0;transition:opacity .6s}
#card-light{position:absolute;inset:0;background:none}
#ink{position:absolute;inset:0;width:100%;height:100%}
#ghost-finger{position:absolute;z-index:8;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:99px;
  background:radial-gradient(circle,rgba(226,51,67,.7),rgba(226,51,67,0) 70%);opacity:0;
  transition:opacity .4s;pointer-events:none}
#ghost-finger span{position:absolute;left:30px;top:4px;white-space:nowrap;font-size:11px;color:var(--ink-3)}
/* "Maya is drawing…" — ink pill, bottom-left, p2 verbatim */
#canvas-note{position:absolute;z-index:7;left:16px;bottom:14px;white-space:nowrap;
  padding:7px 14px;border-radius:999px;background:var(--emph);color:var(--emph-ink);
  font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s}
#canvas-note:not(:empty){opacity:1}
#whisper{position:absolute;z-index:7;left:12px;right:12px;top:44%;text-align:center;
  font-family:Caveat,cursive;font-weight:600;font-size:24px;color:var(--ink-3);
  pointer-events:none;opacity:0;transition:opacity .6s}
#whisper.on{opacity:1}
#mirror-line{position:absolute;z-index:6;left:50%;top:16px;bottom:16px;width:1px;opacity:0;
  background:repeating-linear-gradient(180deg,var(--ink-5) 0 6px,transparent 6px 12px);
  transition:opacity .4s;pointer-events:none}
#warm-layer{position:absolute;inset:0;z-index:4;pointer-events:none}
.warm-spot{position:absolute;border-radius:99px;pointer-events:none;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(233,161,59,.45),rgba(233,161,59,0) 68%)}
#bloom{position:absolute;z-index:5;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:99px;
  background:radial-gradient(circle,rgba(226,51,67,.35),rgba(226,51,67,0) 66%);opacity:0;
  pointer-events:none;transition:opacity .5s}
#canvas-tag{position:absolute;z-index:7;right:16px;top:14px;padding:6px 12px;border-radius:999px;
  background:var(--emph);color:var(--emph-ink);font-size:12px;opacity:0;transition:opacity .3s}
#canvas-tag.on{opacity:1}

/* dock: brushes + the pen palette */
#dock{margin:14px 20px 0;flex:none;display:flex;flex-direction:column;gap:10px}
/* 390 minus 40 of rail leaves 350: three 46px rounds and three 8px gaps take
   162, so the palette gets 188 and the row never overflows the device. */
.dock-row{display:flex;align-items:center;gap:8px}
#brushes{height:54px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);
  padding:0 8px;justify-content:space-between}
.tool{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:17px;border:1px solid transparent;color:var(--ink);opacity:.5}
.tool.is-on{background:var(--red-wash);border-color:var(--red-line);opacity:1}
.tool.is-on .ts-i{color:var(--red)}
.tool:active{transform:scale(.92)}
#colors{flex:1;min-width:0;height:54px;border-radius:999px;background:var(--surface);
  border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;gap:12px}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--hairline) inset}
.swatch.is-on{border-color:var(--ink)}
.rbtn{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:var(--ink)}
.rbtn:active{transform:scale(.92)}
.rbtn.hot{background:var(--red);color:var(--on-red);border-color:transparent}
.rbtn.hot .ts-i{color:var(--on-red)}
.rbtn.hot.armed{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes pulseDot{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ------------------------------------------------ the one control bar — p2 */
#controlbar{display:flex;align-items:center;gap:10px;padding:16px 20px 26px;flex:none}
.cb{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;color:var(--ink)}
.cb:active{transform:scale(.93)}
#cb-room{flex:1;height:52px;border-radius:999px;background:var(--emph);color:var(--emph-ink);
  border:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}

/* buttons — p1/p3/p4. Primary red, primary ink, secondary white. */
.btn-red{min-height:58px;border-radius:999px;background:var(--red);color:var(--on-red);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;width:100%}
.btn-ink{min-height:58px;border-radius:999px;background:var(--emph);color:var(--emph-ink);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;width:100%}
.btn-plain{min-height:56px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;width:100%;color:var(--ink)}
.btn-red:active,.btn-ink:active,.btn-plain:active{transform:scale(.98)}

/* ------------------------------------------- the shapes every frame reuses */
/* The 61 frames are built from about six blocks. These are those blocks, so a
   screen is a list of them rather than a page of inline style. */

/* eyebrow + display + lede, left-aligned — p46/p47/p50/p51 and most rooms */
.head{padding:22px 24px 0;flex:none}
.head .k{font-size:14px;color:var(--ink-3)}
.head .h{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.head .h.sm{font-size:30px}
.head .l{font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:10px}

/* a padded block card, and its inverted twin */
.card{border-radius:20px;background:var(--surface);border:1px solid var(--hairline);
  padding:16px 18px;text-align:left;width:100%;color:var(--ink);display:block}
.card .t{font-size:15px;font-weight:700;display:block}
.card .d{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45;display:block}
.card.ink{background:var(--emph);border-color:transparent;color:var(--emph-ink)}
.card.ink .d{color:var(--emph-ink-3)}
.card.ink .lbl{font-size:12px;font-weight:700;color:var(--emph-red);
  letter-spacing:.14em;text-transform:uppercase}
.card.ink .body{font-size:14px;line-height:1.5;color:var(--emph-ink-2);margin-top:8px}
.card.quiet{background:var(--ground-alt);border-color:var(--hairline)}
button.card:active{transform:scale(.99)}

/* the emphasised card — 2px, and only ever one per screen */
.card.pick{border:2px solid var(--red);padding:15px 17px}
.card.pick-ink{border:2px solid var(--ink);padding:15px 17px}
/* a card that is really a row */
.card.line{display:flex;align-items:center;gap:14px}
.card.line .grow{flex:1;min-width:0}
.card.line .end{font-size:13px;font-weight:700;flex:none}
.card.line .end.red{color:var(--red-text)}
.card.line .end.mute{color:var(--ink-4);font-weight:600}
.card.warn{background:var(--red-wash);border-color:var(--red-line)}

/* segmented choice — p28, p30, p45 */
.seg{display:flex;gap:8px;padding:16px 20px 0;flex:none}
.seg button{flex:1;padding:12px 0;border-radius:14px;font-size:14px;background:var(--surface);
  border:1px solid var(--hairline);color:var(--ink)}
.seg button.on{background:var(--emph);color:var(--emph-ink);border-color:transparent;font-weight:600}

/* one progress bar shape — savings, trips, missions */
.bar{height:9px;border-radius:99px;background:var(--ground-alt);overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:var(--red);transition:width .3s ease}

/* the red banner — a clash, a shock, anything the screen is actually about */
.banner{margin:18px 20px 0;border-radius:22px;background:var(--red);color:var(--on-red);
  padding:22px;flex:none}
.banner .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.banner .h{font-size:26px;font-weight:700;line-height:1.2;margin-top:10px}
.banner.ink{background:var(--emph);color:var(--emph-ink)}
.banner.ink .lbl{color:var(--emph-red);opacity:1;font-weight:700}

/* the dashed aside — always the rule, never the content */
.note{border-radius:18px;background:var(--ground-alt);border:1px dashed var(--dashed);
  padding:15px 17px;font-size:13px;line-height:1.55;color:var(--ink-2)}

/* a grouped table of label/value rows sharing one card — p51, p35, p26 */
.sheet{border-radius:20px;background:var(--surface);border:1px solid var(--hairline);overflow:hidden}
.sheet .r{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px}
.sheet .r + .r{border-top:1px solid var(--divider)}
.sheet .r .k{font-size:15px;color:var(--ink-2)}
.sheet .r .v{font-size:14px;font-weight:700;flex:none}
.sheet .r .v.red{color:var(--red-text)}

/* a column of blocks at the screen's rail */
.stackcol{padding:18px 20px 0;display:flex;flex-direction:column;gap:9px;flex:none}
.stackcol.grow{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.stackcol.grow::-webkit-scrollbar{display:none}

/* Everything below the header scrolls. The frames are drawn at exactly 844
   and several sit flush against it, so any copy that runs a line long — or
   any language that is not English — would push the primary action off the
   bottom of a screen that has no way to reach it. */
.page{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page > .spacer{flex:1 0 12px}

/* the quiet grounds — p46/p51 sit on paper-alt, p54 on paper-deep */
.scr[data-ground="alt"]{background:var(--ground-alt)}
.scr[data-ground="deep"]{background:var(--ground-deep)}
.actions{display:flex;gap:12px;padding:0 20px 18px;flex:none}
.spacer{flex:1;min-height:8px}

#tabs,#streakpill,#wordmark,#more-btn{display:none}

#sheet{position:absolute;inset:0;z-index:40;background:var(--scrim)}
#sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:80%;border-radius:26px 26px 0 0;
  border:1px solid var(--hairline);border-bottom:none;background:var(--ground);
  padding:10px 14px 20px;overflow:auto;overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-5);margin:0 auto 10px}
.sh-group{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);padding:16px 10px 4px}
.sh-item{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:16px;
  text-align:left;color:var(--ink);border:1px solid transparent}
.sh-item:active{background:var(--surface);border-color:var(--hairline)}
.sh-item .ts-i{font-size:20px;width:28px;height:22px;flex:none}
.sh-item b{display:block;font-size:16px;font-weight:600}
.sh-item i{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.sh-now{background:var(--red-wash);border-color:var(--red-line)}
.sh-now .ts-i{color:var(--red)}

#panel{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;background:var(--ground)}
#panel-bar{display:flex;align-items:center;gap:10px;padding:52px 20px 8px;flex:none}
#panel-close{font-size:15px;width:36px;height:36px;border-radius:50%;background:var(--surface);
  border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center}
#panel-title{font-size:17px;font-weight:600}
#panel-aux{margin-left:auto;font-size:13px;font-weight:600;color:var(--red-text);font-variant-numeric:tabular-nums}
#panel-body{flex:1;min-height:0;position:relative;padding:8px 20px 24px;overflow:auto;
  display:flex;flex-direction:column;gap:11px;scrollbar-width:none}
#panel-body::-webkit-scrollbar{display:none}
.p-canvas{position:relative;flex:none;height:320px;border-radius:24px;overflow:hidden;

.p-canvas canvas{position:absolute;inset:0;width:100%;height:100%}
.p-note{font-size:13px;line-height:1.55;color:var(--ink-2)}
.p-cta{min-height:52px;border-radius:999px;background:var(--red);color:var(--on-red);display:flex;align-items:center;

@keyframes traceDraw{
  0%{stroke-dashoffset:320;opacity:1}

<script>
/* Theme, before first paint. Paper is the design; dark is a preference, and
   "auto" means no attribute at all so the CSS media query decides. Runs here
   rather than in app.js because a stamped attribute after paint is a flash. */
(function(){
  var K='trace:theme';
  function apply(p){
    if(p==='paper'||p==='dark') document.documentElement.setAttribute('data-theme',p==='paper'?'light':'dark');
    else document.documentElement.removeAttribute('data-theme');
  }
  var pref='paper';
  try{ pref=localStorage.getItem(K)||'paper'; }catch(e){}
  apply(pref);
  window.TRACE_THEME={
    get:function(){ try{ return localStorage.getItem(K)||'paper'; }catch(e){ return 'paper'; } },
    set:function(p){
      try{ localStorage.setItem(K,p); }catch(e){}
      apply(p);
      /* strokes name a palette slot and resolve per device, so a flip needs
         the token cache dropped and a repaint — nothing stored changes */
      window.dispatchEvent(new Event('themechange'));
      window.dispatchEvent(new Event('resize'));
    }
  };
})();
</script>

<script>
/* trace — the remaining designed features, wired for real.
   Registered into the main app through the explicit API in app.js. */
window.TRACE_EXTRA = (api) => {
'use strict';
const { openPanel, miniCanvas, playInto, toast, log, buzz, store, SHAPES,
        wobblePath, jit, sara, redraw, closeSheet, strokes, canvas, note,
        hooks, $, now, DPR } = api;

const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const hint = (t) => el(`<div class="p-hint">${t}</div>`);
const noteEl = (t) => el(`<div class="p-note">${t}</div>`);
const cta = (t, fn) => { const b = el(`<button class="p-cta">${t}</button>`); b.addEventListener('click', fn); return b; };
const ghostBtn = (t, fn) => { const b = el(`<button class="p-ghost">${t}</button>`); b.addEventListener('click', fn); return b; };

function toggleRow(body, label, sub, on, onChange) {
  const row = el(`<button style="display:flex;align-items:center;gap:12px;justify-content:space-between;width:100%;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--hairline);color:var(--ink);text-align:left">
    <span><b style="display:block;font-size:14px;font-weight:600">${label}</b><i style="display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px">${sub}</i></span>
    <span class="tg" style="flex:none;width:44px;height:26px;border-radius:99px;position:relative;transition:background .2s"><i style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:transform .2s"></i></span></button>`);
  const k = row.querySelector('.tg');
  const paint = () => { k.style.background = on ? '#c64b52' : 'var(--hairline)'; k.firstChild.style.transform = on ? 'translateX(18px)' : ''; };
  paint();
  row.addEventListener('click', () => { on = !on; paint(); buzz(8); onChange && onChange(on); });
  body.appendChild(row);
  return { get: () => on };
}

/* ---------------------------------------------------------- 10c palm */
function palmToPalm() {
  openPanel('palm to palm', (body) => {
    body.appendChild(noteEl('Flatten your hand on the screen and hold. It keeps the outline — actual size. She lays hers on top.'));
    const { box, c, x, fit } = miniCanvas(400);
    body.appendChild(box);
    const stat = el('<div class="p-note" style="text-align:center"></div>');
    body.appendChild(stat);
    const h = hint('press and hold with your whole hand'); body.appendChild(h);
    let yours = null, raf;
    const hand = (w2, h2, scale, col, lw) => {
      // crude, deliberately — a traced hand, not a vector glyph
      const base = [[.42,.96],[.34,.74],[.30,.56],[.24,.50],[.22,.42],[.28,.40],[.33,.47],
        [.34,.26],[.40,.24],[.41,.44],[.46,.16],[.52,.16],[.53,.44],[.58,.20],[.64,.22],
        [.62,.46],[.70,.30],[.75,.34],[.68,.52],[.66,.74],[.60,.96]];
      x.lineCap = x.lineJoin = 'round'; x.strokeStyle = col; x.lineWidth = lw;
      x.beginPath();
      base.forEach(([px, py], i) => {
        const X = (px - .5) * w2 * scale + w2 / 2, Y = (py - .5) * h2 * scale + h2 / 2;
        i ? x.lineTo(jit(X, 2), jit(Y, 2)) : x.moveTo(X, Y);
      });
      x.stroke();
    };
    const paint = () => {
      requestAnimationFrame(fit);
      const w2 = box.clientWidth, h2 = box.clientHeight;
      x.clearRect(0, 0, w2, h2);
      // guide, so the panel is never an empty box
      if (!yours) { x.setLineDash([6, 9]); hand(w2, h2, .96, 'rgba(247,239,233,.22)', 3); x.setLineDash([]); }
      if (yours) hand(w2, h2, .96, 'rgba(247,239,233,.6)', 4);
      if (yours && yours.her) hand(w2, h2, .87, '#ff9ea9', 4);
      raf = requestAnimationFrame(paint);
    };
    paint();
    let t0 = 0;
    box.addEventListener('pointerdown', () => { t0 = now(); h.textContent = 'hold still…'; });
    box.addEventListener('pointerup', () => {
      if (now() - t0 > 500) {
        yours = { her: false };
        stat.textContent = 'YOURS 19.8 cm';
        h.textContent = 'sent. she’ll lay hers on top when she wakes.';
        log('palm captured');
        sara.after(2200, () => {
          yours.her = true;
          stat.textContent = 'YOURS 19.8 cm · HERS 17.2 cm';
          h.textContent = '2.6 cm of her, missing';
          buzz([20, 40, 20]);
        });
      }
    });
    return () => cancelAnimationFrame(raf);
  });
}

/* ------------------------------------------------- 10g · fogged glass */
function fogged() {
  openPanel('fogged glass', (body) => {
    body.appendChild(noteEl('Breathe on it and wipe. She wipes from her side. You meet in the middle.'));
    const { box, c, x, fit } = miniCanvas(380);
    body.appendChild(box);
    const h = hint('wipe with your finger'); body.appendChild(h);
    let ready = false;
    requestAnimationFrame(() => {
      fit();
      const w2 = box.clientWidth, h2 = box.clientHeight;
      const g = x.createLinearGradient(0, 0, 0, h2);
      g.addColorStop(0, TOK('--ground-alt')); g.addColorStop(1, TOK('--ink-3'));
      x.fillStyle = g; x.fillRect(0, 0, w2, h2);
      x.lineCap = 'round'; x.strokeStyle = '#fff'; x.lineWidth = 10;
      const pts = SHAPES.heart.map(([px, py]) => ({ x: px * w2, y: py * h2 }));
      x.beginPath(); x.moveTo(pts[0].x, pts[0].y); pts.forEach(p => x.lineTo(jit(p.x, 3), jit(p.y, 3))); x.stroke();
      const fog = document.createElement('canvas');
      fog.width = w2 * DPR; fog.height = h2 * DPR;
      fog.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
      const fx = fog.getContext('2d'); fx.setTransform(DPR, 0, 0, DPR, 0, 0);
      fx.fillStyle = 'rgba(226,232,240,.93)'; fx.fillRect(0, 0, w2, h2);
      box.appendChild(fog);
      const wipe = (px, py, r) => { fx.save(); fx.globalCompositeOperation = 'destination-out';
        fx.beginPath(); fx.arc(px, py, r, 0, 7); fx.fill(); fx.restore(); };
      box.addEventListener('pointermove', (e) => {
        if (!e.buttons) return;
        const r = box.getBoundingClientRect();
        wipe(e.clientX - r.left, e.clientY - r.top, 24); buzz(3);
      });
      // she wipes from her side, unprompted
      let sy = h2 * .3;
      const her = setInterval(() => {
        if (!box.isConnected) return clearInterval(her);
        wipe(w2 * (.62 + Math.sin(sy / 40) * .1), sy, 20);
        sy += 9; if (sy > h2 * .9) { sy = h2 * .2; }
      }, 90);
      setTimeout(() => { if (box.isConnected) h.textContent = 'she’s wiping from her side'; }, 1800);
      ready = true;
    });
  });
}

/* -------------------------------------------------- 10g · thumbprint */
function thumbprint() {
  api.closeSheet();
  note('press anywhere — it never quite wipes clean of her');
  const { wrap } = canvas();
  const layer = $('#warm-layer');
  const smudge = (x, y, mine) => {
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:34px;height:44px;margin:-22px 0 0 -17px;border-radius:50% 50% 45% 45%;
      background:radial-gradient(ellipse at 50% 45%, rgba(255,255,255,${mine ? .13 : .10}), rgba(255,255,255,0) 68%);
      box-shadow:inset 0 0 0 1px var(--surface);transform:rotate(${(Math.random() - .5) * 40}deg);pointer-events:none`;
    layer.appendChild(d);
  };
  const onDown = (e) => {
    const r = wrap.getBoundingClientRect();
    smudge(e.clientX - r.left, e.clientY - r.top, true);
  };
  wrap.addEventListener('pointerdown', onDown);
  for (let i = 0; i < 5; i++) smudge(40 + Math.random() * 200, 60 + Math.random() * 380, false);
  toast('her thumbprints are already on it');
  log('thumbprint smudges on');

function heartRate() {

    const who = el('<div class="p-hint">hold to send yours</div>'); body.appendChild(who);
    const dot = ring.querySelector('.hr');
    let bpm = 68, holding = false, t = null;
    const beat = () => {
      if (!dot.isConnected) return;
      dot.style.transform = 'scale(1.16)';
      setTimeout(() => dot.style.transform = 'scale(1)', 120);
      if (holding) buzz(16);
      bpm += (Math.random() - .45) * 3;
      bpm = Math.max(58, Math.min(104, bpm));
      bpmEl.textContent = Math.round(bpm) + ' bpm';

    body.addEventListener('pointerdown', () => { holding = true; bpm += 9; who.textContent = 'she can feel it'; log('heart rate sent live'); });
    body.addEventListener('pointerup', () => { holding = false; who.textContent = 'hold to send yours'; });
    return () => clearTimeout(t);
  });

/* ------------------------------------------------ 10g · keep it alive */
function keepAlive() {
  api.closeSheet();
  const { W, H } = canvas();
  const s = { pts: wobblePath(SHAPES.sun, 4, 5), c: 'amber', w: 10, brush: 'pen', who: 'sara', born: now(), life: 1 };
  strokes.add(s);
  note('she drew this. it dies unless you trace it.');
  toast('go over her line to keep it alive');
  log('keep-it-alive started');
  let alive = 1;
  const decay = setInterval(() => {
    const { wrap } = canvas();
    if (!wrap.isConnected) return clearInterval(decay);
    alive -= .012;
    s.c = `rgba(244,198,107,${Math.max(0, alive)})`;
    redraw();
    if (alive <= 0) {
      clearInterval(decay);
      strokes.set(strokes.all().filter(k => k !== s));
      note('it died. she’ll know.');
      log('keep-it-alive: died');
      setTimeout(() => note(''), 4000);
    }
  }, 260);
  const { wrap } = canvas();
  const revive = (e) => {
    const r = wrap.getBoundingClientRect();
    const p = { x: e.clientX - r.left, y: e.clientY - r.top };
    for (const q of s.pts) if (Math.hypot(p.x - q.x, p.y - q.y) < 22) {
      alive = Math.min(1, alive + .06);
      s.c = `rgba(244,198,107,${alive})`;
      if (alive > .95) note('alive again. for now.');
      redraw(); break;
    }
  };
  wrap.addEventListener('pointermove', revive);
  setTimeout(() => wrap.removeEventListener('pointermove', revive), 60000);
}

/* --------------------------------------------- 10g · finish my sentence */
function finishSentence() {
  openPanel('finish my sentence', (body) => {
    body.appendChild(noteEl('Write. The pen leaves your hand mid-word and lands in hers — you cannot take it back.'));
    const { box, c, x, fit } = miniCanvas(300);
    body.appendChild(box);
    const h = hint('start writing'); body.appendChild(h);
    let pts = [], handed = false, count = 0;
    const draw = (col) => {
      x.lineCap = x.lineJoin = 'round'; x.strokeStyle = col; x.lineWidth = 7;
      x.beginPath();
      pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
      x.stroke();
    };
    box.addEventListener('pointermove', (e) => {
      if (!e.buttons || handed) return;
      requestAnimationFrame(fit);
      const r = box.getBoundingClientRect();
      pts.push({ x: e.clientX - r.left, y: e.clientY - r.top });
      draw('var(--ink)');
      if (++count > 45) {
        handed = true;
        h.textContent = 'the pen is hers now';
        buzz([40, 60, 40]);
        log('pen handed over mid-word');
        let i = 0;
        const last = pts[pts.length - 1];
        const cont = setInterval(() => {
          if (!box.isConnected) return clearInterval(cont);
          const a = i / 26;
          pts.push({ x: last.x + a * 90 + Math.sin(a * 7) * 12, y: last.y + Math.sin(a * 5) * 22 });
          draw('var(--red)');
          if (++i > 26) { clearInterval(cont); h.textContent = 'she finished it.'; }
        }, 60);
      }
    });
  });
}

/* ----------------------------------------------- 10g · blind portrait */
function blindPortrait() {
  openPanel('blind portrait', (body) => {
    body.appendChild(noteEl('Draw each other without looking down. Sixty seconds. Neither of you sees anything until it’s over.'));
    const { box, c, x, fit } = miniCanvas(320);
    body.appendChild(box);
    const timer = el('<div class="p-stat">0:60</div>'); body.appendChild(timer);
    const h = hint('draw. you cannot see it.'); body.appendChild(h);
    let pts = [], left = 60, iv = null, over = false;
    const start = () => {
      if (iv) return;
      iv = setInterval(() => {
        if (!box.isConnected) return clearInterval(iv);
        left--; timer.textContent = '0:' + String(left).padStart(2, '0');
        if (left <= 0) { clearInterval(iv); reveal(); }
      }, 1000);
    };
    const reveal = () => {
      over = true;
      requestAnimationFrame(fit);
      x.clearRect(0, 0, box.clientWidth, box.clientHeight);
      x.lineCap = x.lineJoin = 'round'; x.lineWidth = 6;
      x.strokeStyle = TOK('--red'); x.beginPath();
      pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.stroke();
      // hers
      x.strokeStyle = TOK('--red'); x.beginPath();
      const w2 = box.clientWidth, h2 = box.clientHeight;
      SHAPES.sun.forEach(([px, py], i) => { const X = jit(px * w2, 9), Y = jit(py * h2, 9); i ? x.lineTo(X, Y) : x.moveTo(X, Y); });
      x.stroke();
      h.textContent = 'that’s you, apparently.';
      log('blind portrait revealed');
    };
    box.addEventListener('pointerdown', start);
    box.addEventListener('pointermove', (e) => {
      if (!e.buttons || over) return;
      const r = box.getBoundingClientRect();
      pts.push({ x: e.clientX - r.left, y: e.clientY - r.top });
      // invisible while drawing — only the faintest trace
      x.fillStyle = TOK('--surface');
      x.beginPath(); x.arc(e.clientX - r.left, e.clientY - r.top, 3, 0, 7); x.fill();
    });
    body.appendChild(ghostBtn('reveal now', reveal));
    return () => clearInterval(iv);
  });
}

/* --------------------------------------------------- 10g · whisper */
function whisper() {
  openPanel('whisper', (body) => {
    body.appendChild(noteEl('Draw it tiny. She has to zoom right in to read it — which means she has to want to.'));
    const { box, c, x, fit } = miniCanvas(320);
    body.appendChild(box);
    let zoom = 1;
    const h = hint('drawn small. pinch or press zoom.'); body.appendChild(h);
    const paint = () => {
      fit();   // synchronous: painting before the backing store is sized draws into nothing
      const w2 = box.clientWidth, h2 = box.clientHeight;
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      x.clearRect(0, 0, w2, h2);
      x.save();
      x.translate(w2 / 2, h2 / 2); x.scale(zoom, zoom); x.translate(-w2 / 2, -h2 / 2);
      x.lineCap = x.lineJoin = 'round'; x.strokeStyle = TOK('--red'); x.lineWidth = 1.4 / zoom * 3;
      x.beginPath();
      const sc = .07;
      SHAPES.heart.forEach(([px, py], i) => {
        const X = w2 / 2 + (px - .5) * w2 * sc, Y = h2 / 2 + (py - .5) * h2 * sc;
        i ? x.lineTo(jit(X, .6), jit(Y, .6)) : x.moveTo(X, Y);
      });
      x.stroke();
      x.restore();
    };
    requestAnimationFrame(paint);
    body.appendChild(ghostBtn('zoom in', () => { zoom = Math.min(14, zoom * 1.9); paint(); buzz(6);
      if (zoom > 6) h.textContent = 'it says: “still awake?”'; }));
    box.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(1, Math.min(14, zoom * (e.deltaY < 0 ? 1.15 : .87))); paint(); });
  });
}

/* ------------------------------------------------ 1c · replay, exported */
function replayExport() {
  openPanel('post the replay', (body) => {
    body.appendChild(noteEl('The growth loop is the drawing arriving, not a flat PNG. Scrub to the moment it lands, then export.'));
    const { box, c, x, fit } = miniCanvas(300);
    body.appendChild(box);
    const mine = strokes.all().filter(s => s.who !== 'fx');
    const total = mine.reduce((n, s) => n + s.pts.length, 0) || 1;
    const sliderWrap = el('<div style="display:flex;gap:5px;align-items:center"></div>');
    const range = el('<input type="range" min="0" max="100" value="100" style="flex:1;accent-color:var(--red)">');
    sliderWrap.appendChild(range);
    body.appendChild(sliderWrap);
    const tl = el('<div style="display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:var(--ink-3)"><span>first stroke</span><span>6.0s</span></div>');
    body.appendChild(tl);
    const paint = () => {
      requestAnimationFrame(fit);
      const w2 = box.clientWidth, h2 = box.clientHeight;
      const { W, H } = canvas();
      x.clearRect(0, 0, w2, h2);
      const g = x.createLinearGradient(0, 0, 0, h2);
      g.addColorStop(0, '#2a3a63'); g.addColorStop(1, '#ffd9a0');
      x.fillStyle = g; x.fillRect(0, 0, w2, h2);
      const k = Math.min(w2 / W, h2 / H);
      x.save(); x.translate((w2 - W * k) / 2, (h2 - H * k) / 2); x.scale(k, k);
      let budget = Math.round(total * range.value / 100);
      x.lineCap = x.lineJoin = 'round';
      for (const s of mine) {
        if (budget <= 0) break;
        const n = Math.min(s.pts.length, budget); budget -= n;
        x.strokeStyle = s.c; x.lineWidth = s.w; x.beginPath();
        for (let i = 0; i < n; i++) i ? x.lineTo(s.pts[i].x, s.pts[i].y) : x.moveTo(s.pts[i].x, s.pts[i].y);
        x.stroke();
      }
      x.restore();
    };
    range.addEventListener('input', paint);
    paint();
    if (!mine.length) body.appendChild(hint('draw something first, then come back'));
    body.appendChild(cta('save this frame', () => {
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png'); a.download = 'trace-replay-frame.png'; a.click();
      toast('exported'); log('replay frame exported');
    }));
  });
}

    try { ws = new WebSocket(SUPA_URL); } catch (e) { onStatus('error', 'no websocket'); return; }
    ws.onopen = () => {
      raw({ topic, event: 'phx_join', ref: '1', join_ref: '1',
        payload: { config: { broadcast: { self: false } } } });
      clearInterval(hb);
      hb = setInterval(() => raw({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++ref + 1000) }), 25000);
    };
    ws.onmessage = (m) => {
      let d; try { d = JSON.parse(m.data); } catch { return; }
      if (d.event === 'phx_reply' && d.ref === '1') {
        if (d.payload?.status === 'ok') { alive = true; onStatus('open'); }
        else onStatus('error', 'join refused');
      }
      if (d.event === 'broadcast' && d.payload?.payload) onMsg(d.payload.event, d.payload.payload);
    };
    ws.onclose = () => { alive = false; clearInterval(hb); if (!closed) { onStatus('closed'); setTimeout(connect, 1800); } };
    ws.onerror = () => { if (!alive) onStatus('error', 'unreachable'); };
  };
  connect();
  return {
    kind: 'supabase',
    send: (event, payload) => raw({ topic, event: 'broadcast', ref: String(++ref),
      join_ref: '1', payload: { type: 'broadcast', event, payload } }),
    close: () => { closed = true; clearInterval(hb); try { ws.close(); } catch {} },
  };
}

function localTransport(code, onMsg, onStatus) {
  let bc = null;
  try { bc = new BroadcastChannel('trace:' + code); } catch {}
  const key = 'trace:bus:' + code;
  if (bc) {
    bc.onmessage = (e) => onMsg(e.data.event, e.data.payload);
  } else {
    addEventListener('storage', (e) => {
      if (e.key !== key || !e.newValue) return;
      try { const d = JSON.parse(e.newValue); onMsg(d.event, d.payload); } catch {}
    });
  }
  setTimeout(() => onStatus('open'), 30);
  return {
    kind: 'local',
    send: (event, payload) => {
      if (bc) bc.postMessage({ event, payload });
      else { try { localStorage.setItem(key, JSON.stringify({ event, payload, n: Math.random() })); } catch {} }
    },
    close: () => { bc && bc.close(); },
  };
}

/* ---------------------------------------------------------------- engine */

const me = Math.random().toString(36).slice(2, 8);
let t = null;                 // active transport
let partnerSeen = 0;          // last hello from the other side
let partnerName = 'them';
let hello = null, ptsBuf = [], ptsFlush = null;

const NET = window.TRACE_NET = {
  live: () => !!t && (performance.now() - partnerSeen) < 9000,
  kind: () => (t ? t.kind : null),

  emit(event, payload) {
    if (!t) return;
    if (event === 'sp') {                       // batch stroke points ~12/s
      ptsBuf.push(payload);
      if (!ptsFlush) ptsFlush = setTimeout(() => {
        t.send('sp', { id: ptsBuf[0].id, pts: ptsBuf.map(p => p.pt), from: me });
        ptsBuf = []; ptsFlush = null;
      }, 80);
      return;
    }
    t.send(event, { ...payload, from: me });
  },

  /* the security gate: a 5-char code is never a channel name. It exchanges
     (once, cached) for an unguessable token via the pair edge function, and
     the channel is named by the token. */
  async resolveToken(code) {
    const k = 'trace:token:' + code;
    const hit = localStorage.getItem(k);
    if (hit) return hit;
    const r = await fetch('https://doadibyqqdimzzywcglv.supabase.co/functions/v1/pair', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: 'sb_publishable_W1K6K6qLY2ftOWNBbdm4hA__B7DpmtJ' },
      body: JSON.stringify({ code }),
    });
    if (!r.ok) throw new Error('pair ' + r.status);
    const { token } = await r.json();
    localStorage.setItem(k, token);
    return token;
  },

  join(code, mode, ui) {
    NET.leave();
    const app = window.TRACE_APP;
    const onMsg = (event, p) => {
      if (!p || p.from === me) return;
      partnerSeen = performance.now();
      if (event === 'hi') {
        partnerName = p.name || 'them';
        if (p.tz) NET.partnerTz = p.tz;
        app.partner(true, partnerName);
        if (p.reply) return;
        NET.emit('hi', { name: NET.name, reply: true, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
      }
      else if (event === 'sb') app.remoteBegin(p);
      else if (event === 'sp') app.remotePts(p);
      else if (event === 'se') app.remoteEnd(p);
      else if (event === 'heart') app.remoteHeart();
      else if (event === 'clear') app.remoteClear();
      else if (event === 'sky') app.remoteSky(p);
      else if (event === 'tug') app.remoteTug();
      else if (event === 'note') app.remoteNote(p.text);
      else if (event === 'board') app.remoteBoard(p);
    };
    const onStatus = (s, why) => ui && ui(s, why);
    if (mode !== 'local') {
      NET.resolveToken(code).then((token) => {
        NET.token = token;
        if (NET.code !== code) return;          /* user moved on meanwhile */
        t = supaTransport(token, onMsg, (s, why) => {
          if (s === 'open') {
            NET.emit('hi', { name: NET.name, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
            clearInterval(hello);
            hello = setInterval(() => NET.emit('hi', { name: NET.name, reply: true, tz: Intl.DateTimeFormat().resolvedOptions().timeZone }), 4000);
          }
          onStatus(s, why);
        });
      }).catch(() => onStatus('error', 'code exchange failed — check the connection'));
      NET.code = code; NET.mode = mode;
      return;
    }
    t = localTransport(code, onMsg, (s, why) => {
      if (s === 'open') {
        NET.emit('hi', { name: NET.name, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
        clearInterval(hello);
        hello = setInterval(() => NET.emit('hi', { name: NET.name, reply: true, tz: Intl.DateTimeFormat().resolvedOptions().timeZone }), 4000);
      }
      onStatus(s, why);
    });
    NET.code = code; NET.mode = mode;
  },

  leave() {
    if (t) t.close();
    t = null; clearInterval(hello);
    window.TRACE_APP && window.TRACE_APP.partner(false);
  },

  name: localStorage.getItem('trace:myname') || 'me',
};

function miniCanvas(h = 340) {
  const box = document.createElement('div');
  box.className = 'p-canvas'; box.style.height = h + 'px';
  const c = document.createElement('canvas');
  box.appendChild(c);
  const x = c.getContext('2d');
  const fit = () => { c.width = box.clientWidth * DPR; c.height = box.clientHeight * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); };
  requestAnimationFrame(fit);
  return { box, c, x, fit };

function playInto(x, box, shapes, opts = {}) {
  // draws a sequence of wobbled shapes with real pauses; returns stop()
  let stop = false, timers = [];
  const bw = () => box.clientWidth, bh = () => box.clientHeight;
  (async () => {
    for (const sh of shapes) {
      if (stop) return;
      const base = SHAPES[sh.shape] || SHAPES.squiggle;
      const pts = base.map(([px, py]) => ({ x: px * bw(), y: py * bh() }));
      const dense = [];
      for (let i = 0; i < pts.length - 1; i++)
        for (let s = 0; s < 5; s++) dense.push({
          x: jit(pts[i].x + (pts[i + 1].x - pts[i].x) * s / 5, 3),
          y: jit(pts[i].y + (pts[i + 1].y - pts[i].y) * s / 5, 3) });
      x.lineCap = x.lineJoin = 'round'; x.strokeStyle = penColor(sh.c || 'red'); x.lineWidth = sh.w || 8;
      for (let i = 1; i < dense.length; i++) {
        if (stop || !box.isConnected) return;
        x.beginPath(); x.moveTo(dense[i - 1].x, dense[i - 1].y); x.lineTo(dense[i].x, dense[i].y); x.stroke();
        await new Promise(r => timers.push(setTimeout(r, sh.speed || 26)));
      }
      if (sh.pause) { opts.onPause && opts.onPause(sh.pause); await new Promise(r => timers.push(setTimeout(r, sh.pause))); }
    }
    opts.done && opts.done();
  })();
  return () => { stop = true; timers.forEach(clearTimeout); };
}

/* --- sheet --- */
const sheet = $('#sheet');
function openSheet() {
  const list = $('#sheet-list'); list.innerHTML = '';
  // 50+ features: a filter is no longer optional
  const q = document.createElement('input');
  q.type = 'search'; q.placeholder = 'search features';
  q.style.cssText = 'width:calc(100% - 24px);margin:0 12px 6px;padding:11px 14px;border-radius:14px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font:14px system-ui;outline:none';
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    let lastGroup = null, groupHas = false;
    for (const n of [...list.children]) {
      if (n === q) continue;
      if (n.classList.contains('sh-group')) {
        if (lastGroup) lastGroup.style.display = groupHas ? '' : 'none';
        lastGroup = n; groupHas = false; continue;
      }
      const hit = !v || n.textContent.toLowerCase().includes(v);
      n.style.display = hit ? '' : 'none';
      if (hit) groupHas = true;
    }
    if (lastGroup) lastGroup.style.display = groupHas ? '' : 'none';
  });
  list.appendChild(q);

  // "right now" — three context-aware suggestions (audit P0-2)
  const hr = new Date().getHours();
  const paired = window.TRACE_NET && TRACE_NET.live();
  const nowIds = [];
  if (!paired) nowIds.push('pair');
  if (hr >= 6 && hr < 11) nowIds.push('slept', 'prompt');
  else if (hr >= 21 || hr < 2) nowIds.push('bothhere', 'touching');
  else nowIds.push('prompt', 'mirror');
  const picks = nowIds.map(id => FEATURES.find(f => f.id === id)).filter(Boolean).slice(0, 3);
  if (picks.length) {
    const g = document.createElement('div'); g.className = 'sh-group'; g.textContent = 'right now';
    list.appendChild(g);
    for (const f of picks) {
      const b = document.createElement('button');
      b.className = 'sh-item sh-now';
      b.innerHTML = `<svg class="ts-i"><use href="#i-${f.i}"/></svg><span><b>${f.n}</b><i>${f.d}</i></span>`;
      b.addEventListener('click', () => openFeature(f.id));
      list.appendChild(b);
    }
  }
  for (const f of FEATURES) {
    if (f.g) { const g = document.createElement('div'); g.className = 'sh-group'; g.textContent = f.g; list.appendChild(g); continue; }
    const b = document.createElement('button');
    b.className = 'sh-item';
    b.innerHTML = `<svg class="ts-i"><use href="#i-${f.i}"/></svg><span><b>${f.n}</b><i>${f.d}</i></span>`;
    b.addEventListener('click', () => openFeature(f.id));
    list.appendChild(b);
  }
  sheet.classList.remove('hidden');
}
const closeSheet = () => sheet.classList.add('hidden');
$('#more-btn').addEventListener('click', openSheet);
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });

function openFeature(id) {
  const f = FEATURES.find(x => x.id === id);
  if (!f) return;
  closeSheet(); f.run();
  /* most features open a panel; the rest paint on the canvas — and a feature
     launched from a room would otherwise animate on a screen nobody is looking
     at. If nothing opened, go where the feature actually happens. */
  const R = window.TRACE_ROOMS;
  if (!R || !R.screens) return;
  const panelOpen = !panel.classList.contains('hidden');
  const onCanvas = !R.screens.canvas.classList.contains('hidden');
  if (!panelOpen && !onCanvas) R.show('canvas');
}

/* --- scratch-off --- */
function openScratch() {
  openPanel('it arrived covered', (body) => {
    const { box, c, x, fit } = miniCanvas(380);
    body.appendChild(box);
    const note = document.createElement('div'); note.className = 'p-hint'; note.textContent = 'scratch it off';
    body.appendChild(note);
    let stopPlay = null;
    requestAnimationFrame(() => {
      fit();
      const w = box.clientWidth, h = box.clientHeight;
      // her drawing underneath
      const g = c.getContext('2d');
      const under = document.createElement('canvas'); under.width = w * DPR; under.height = h * DPR;
      const ux = under.getContext('2d'); ux.setTransform(DPR, 0, 0, DPR, 0, 0);
      const grad = ux.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, TOK('--amber')); grad.addColorStop(.5, TOK('--red-text')); grad.addColorStop(1, TOK('--ground-alt'));
      ux.fillStyle = grad; ux.fillRect(0, 0, w, h);
      ux.lineCap = ux.lineJoin = 'round'; ux.strokeStyle = '#fff'; ux.lineWidth = 11;
      const pts = SHAPES.heart.map(([px, py]) => ({ x: px * w, y: py * h }));
      ux.beginPath(); ux.moveTo(pts[0].x, pts[0].y);
      pts.forEach(p => ux.lineTo(jit(p.x, 3), jit(p.y, 3))); ux.stroke();
      // cover
      g.fillStyle = TOK('--ground-alt');
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#37262f';
      for (let i = -h; i < w; i += 14) { g.save(); g.translate(i, 0); g.rotate(.45); g.fillRect(0, 0, 7, h * 1.6); g.restore(); }
      let cleared = 0;
      const scratch = (e) => {
        const r = box.getBoundingClientRect();
        const px = e.clientX - r.left, py = e.clientY - r.top;
        g.save(); g.globalCompositeOperation = 'destination-out';
        g.beginPath(); g.arc(px, py, 26, 0, 7); g.fill(); g.restore();
        cleared++;
        buzz(4);
        if (cleared === 30) { note.textContent = 'she’ll see the moment you uncover it'; }
        if (cleared > 90) { g.clearRect(0, 0, w, h); note.textContent = 'from Sara · 4 minutes ago'; box.removeEventListener('pointermove', scratch); log('scratch-off revealed'); }
      };
      box.style.backgroundImage = `url(${under.toDataURL()})`;
      box.style.backgroundSize = 'cover';
      box.addEventListener('pointermove', scratch);
    });
    return () => stopPlay && stopPlay();
  });
}

/* --- touching --- */
function openTouching() {
  openPanel('touching', (body) => {
    paux.textContent = '';
    const { box, c, x, fit } = miniCanvas(400);
    body.appendChild(box);
    const hint = document.createElement('div'); hint.className = 'p-hint';
    hint.textContent = 'find her finger. you can’t see your own.';
    body.appendChild(hint);
    const bestRow = document.createElement('div'); bestRow.className = 'p-note'; bestRow.style.textAlign = 'center';
    const bestVal = store.get('touchBest', 11);
    bestRow.textContent = `longest 00:${String(bestVal).padStart(2, '0')} · ${store.get('touchCount', 1204).toLocaleString()} times since March`;
    body.appendChild(bestRow);
    let sx = .3, sy = .3, tx = .7, ty = .6, you = null, held = 0, t0 = 0, raf;
    const loop = () => {
      if (!box.isConnected) return;
      requestAnimationFrame(fit);
      const w = box.clientWidth, h = box.clientHeight;
      // sara wanders
      if (Math.random() < .01) { tx = .15 + Math.random() * .7; ty = .15 + Math.random() * .7; }
      sx += (tx - sx) * .012; sy += (ty - sy) * .012;
      x.clearRect(0, 0, w, h);
      const g = x.createRadialGradient(sx * w, sy * h, 4, sx * w, sy * h, 30);
      g.addColorStop(0, 'rgba(255,122,156,.95)'); g.addColorStop(1, 'rgba(255,122,156,0)');
      x.fillStyle = g; x.beginPath(); x.arc(sx * w, sy * h, 30, 0, 7); x.fill();
      if (you) {
        const d = Math.hypot(you.x - sx * w, you.y - sy * h);
        if (d < 26) {
          if (!t0) { t0 = now(); log('TOUCHING'); }
          held = (now() - t0) / 1000;
          buzz(8);
          const glow = x.createRadialGradient(you.x, you.y, 8, you.x, you.y, 90);
          glow.addColorStop(0, 'rgba(255,205,170,.8)'); glow.addColorStop(1, 'rgba(255,160,140,0)');
          x.fillStyle = glow; x.beginPath(); x.arc(you.x, you.y, 90, 0, 7); x.fill();
          hint.textContent = 'right now, technically, we’re touching';
          paux.textContent = '00:' + String(Math.floor(held)).padStart(2, '0');
        } else if (t0) {
          if (held > bestVal) { store.set('touchBest', Math.floor(held)); }
          store.set('touchCount', store.get('touchCount', 1204) + 1);
          t0 = 0; held = 0;
          hint.textContent = 'find her finger. you can’t see your own.';
        }
      }
      raf = requestAnimationFrame(loop);
    };
    loop();
    const mv = (e) => { const r = box.getBoundingClientRect(); you = { x: e.clientX - r.left, y: e.clientY - r.top }; };
    box.addEventListener('pointermove', mv);
    box.addEventListener('pointerdown', mv);
    box.addEventListener('pointerleave', () => you = null);
    return () => cancelAnimationFrame(raf);
  });
}

/* --- the string --- */
function openString() {
  openPanel('the string', (body) => {
    const { box, c, x, fit } = miniCanvas(300);
    body.appendChild(box);
    body.insertAdjacentHTML('beforeend', '<div class="p-hint">drag your end gently. one tug = thinking of you.</div>');
    const note = document.createElement('div'); note.className = 'p-note'; note.style.textAlign = 'center';
    note.textContent = 'held since 21:40'; body.appendChild(note);
    let pull = 0, snapped = false, raf, sag = 40;
    const loop = () => {
      if (!box.isConnected) return;
      requestAnimationFrame(fit);
      const w = box.clientWidth, h = box.clientHeight;
      x.clearRect(0, 0, w, h);
      const y0 = h * .45;
      x.lineCap = 'round';
      if (!snapped) {
        x.strokeStyle = TOK('--amber'); x.lineWidth = 4.5;
        x.beginPath(); x.moveTo(26, y0);
        x.quadraticCurveTo(w / 2, y0 + sag - pull * 1.6, w - 26, y0);
        x.stroke();
      } else {
        x.strokeStyle = 'rgba(233,161,59,.4)'; x.lineWidth = 4;
        x.beginPath(); x.moveTo(26, y0); x.quadraticCurveTo(w * .3, y0 + 30, w * .42, y0 + 60); x.stroke();
        x.beginPath(); x.moveTo(w - 26, y0); x.quadraticCurveTo(w * .7, y0 + 30, w * .58, y0 + 60); x.stroke();
      }
      const dot = (px, col) => { x.fillStyle = col; x.beginPath(); x.arc(px, y0, 12, 0, 7); x.fill();
        x.strokeStyle = '#fff'; x.lineWidth = 3; x.stroke(); };
      dot(26, 'var(--red)'); dot(box.clientWidth - 26, 'var(--red)');
      pull *= .92;
      raf = requestAnimationFrame(loop);
    };
    loop();
    let dy = 0, y00 = 0;
    box.addEventListener('pointerdown', (e) => { y00 = e.clientY; });
    box.addEventListener('pointermove', (e) => {
      if (!e.buttons || snapped) return;
      pull = Math.max(0, y00 - e.clientY);
      if (pull > 12 && pull < 20) { buzz(10); }
      if (pull > 95) { snapped = true; note.textContent = 'it snapped. for both of you.'; buzz([60, 50, 120]); log('the string SNAPPED'); }
    });
    box.addEventListener('pointerup', () => {
      if (!snapped && pull > 12) {
        toast('she felt that'); log('you tug the string');
        if (window.TRACE_NET && TRACE_NET.live()) TRACE_NET.emit('tug', {});
        else sara.after(2400, () => stringTug('sara'));
      }
    });
    return () => cancelAnimationFrame(raf);
  });
}

      // yours on right

      x.restore();
      x.strokeStyle = TOK('--ink-5'); x.setLineDash([5, 8]); x.beginPath(); x.moveTo(w / 2, 10); x.lineTo(w / 2, h - 10); x.stroke(); x.setLineDash([]);
      const match = 40 + Math.floor(Math.random() * 45);

/* --- hot & cold --- */
function openHotCold() {
  openPanel('hot & cold', (body) => {
    body.insertAdjacentHTML('beforeend', '<div class="p-hint">she hid something on a canvas ten screens wide.<br>move. the glass warms.</div>');
    const { box, c, x, fit } = miniCanvas(360);
    body.appendChild(box);
    const temp = document.createElement('div'); temp.className = 'p-stat'; temp.textContent = 'cold';
    body.appendChild(temp);
    const target = { x: .2 + Math.random() * .6, y: .2 + Math.random() * .6 };
    let found = false;
    const paint = (heat) => {
      requestAnimationFrame(fit);
      const w = box.clientWidth, h = box.clientHeight;
      x.clearRect(0, 0, w, h);
      const cold = [11, 18, 46], hot = [201, 102, 58];
      const mix = cold.map((cc, i) => Math.round(cc + (hot[i] - cc) * heat));
      const g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, `rgb(${mix.map(v => Math.max(0, v - 24)).join(',')})`);
      g.addColorStop(1, `rgb(${mix.join(',')})`);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      if (found) {
        x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#fff'; x.lineWidth = 10;
        const pts = SHAPES.heart.map(([px, py]) => ({ x: (target.x * .6 + .2 + (px - .5) * .4) * w, y: (target.y * .6 + .2 + (py - .5) * .4) * h }));
        x.beginPath(); x.moveTo(pts[0].x, pts[0].y); pts.forEach(p => x.lineTo(jit(p.x, 2), jit(p.y, 2))); x.stroke();
      }
    };
    paint(0);
    box.addEventListener('pointermove', (e) => {
      if (found) return;
      const r = box.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      const d = Math.hypot(px - target.x, py - target.y);
      const heat = Math.max(0, 1 - d * 1.8);
      paint(heat);
      temp.textContent = heat > .92 ? 'BURNING' : heat > .7 ? 'hot' : heat > .45 ? 'warmer' : heat > .25 ? 'warm' : 'cold';
      if (heat > .5) buzz(Math.round(heat * 12));
      if (heat > .96) { found = true; paint(1); temp.textContent = 'found it.'; toast('she hid it 2 days ago. she watched you get close.'); log('hot&cold: found'); buzz([30, 40, 80]); }
    });
  });
}

/* --- replay --- */
function runReplay() {
  const mine = strokes.filter(s => s.who !== 'fx');
  if (!mine.length) { toast('draw something first — then watch it again'); return; }
  toast('replay — every stroke, in order');
  const saved = strokes; strokes = []; redraw();
  let i = 0;
  const playNext = () => {
    if (i >= mine.length) { strokes = saved; redraw(); return; }
    const s = mine[i++]; const copy = { ...s, pts: [] };
    strokes.push(copy);
    let j = 0;
    const t = setInterval(() => {
      copy.pts.push(s.pts[j++]); redraw();
      if (j >= s.pts.length) { clearInterval(t); setTimeout(playNext, 260); }
    }, 16);
  };
  playNext();
}

    stat.textContent = count.toLocaleString() + ' strokes';

  for (const r in FEATURE_ROOM) if (FEATURE_ROOM[r].includes(id)) return r;
  return 'Canvas';
};
const featuresIn = (room) => (APP.features ? APP.features() : []).filter((f) => f.id && roomOf(f.id) === room);

function renderRooms(query) {
  const list = $('#rooms-list');
  const q = (query || '').trim().toLowerCase();
  list.innerHTML = '';

  if (!q) {
    list.appendChild(el(`<div class="eyebrow" style="padding:6px 4px 2px">Five rooms</div>`));
    for (const r of ROOMS) {
      const row = el(`<button class="row">
        <span class="ico${r.name === 'Canvas' ? ' red' : ' ink'}">${r.icon}</span>
        <span class="grow"><span class="n">${r.name}</span><span class="s big">${r.sub}</span></span>
        <span class="cnt" style="color:${r.tint}">${r.count()}</span>
        <span class="chev">›</span></button>`);
      row.addEventListener('click', () => openRoom(r.name));
      list.appendChild(row);
    }
    list.appendChild(el(`<div class="eyebrow" style="padding:16px 4px 2px">Beyond the rooms</div>`));
    for (const [label, sub, go] of [
      ['Your board', 'What her widget shows — you decide', () => show('board')],
      ['Every widget state', 'And who wins when they compete', () => show('states')],
      ['Quiet & private', 'Three rules the app can’t break', () => show('rules')],
      ['Every surface', 'Watch, lock screen, Android, tablet', () => show('surfaces')],
      ...BEYOND,
    ]) {
      const row = el(navRow(label, sub));
      row.addEventListener('click', go);
      list.appendChild(row);
    }
    return;
  }

  /* search runs across every feature the engine has, grouped by room */
  const all = (APP.features ? APP.features() : []).filter((f) => f.id);
  const hits = all.filter((f) => (f.n + ' ' + f.d).toLowerCase().includes(q));
  if (!hits.length) {
    list.appendChild(el(`<div class="foot" style="padding-top:30px">Nothing matches “${esc(q)}”.</div>`));
    return;
  }
  let last = null;
  for (const f of hits) {
    const r = roomOf(f.id);
    if (r !== last) { list.appendChild(el(`<div class="eyebrow" style="padding:14px 4px 2px">${r}</div>`)); last = r; }
    const row = el(navRow(f.n, f.d));
    row.addEventListener('click', () => APP.openFeature && APP.openFeature(f.id));
    list.appendChild(row);
  }
}

function openRoom(name) {
  if (name === 'Canvas') return show('canvas');
  /* a name nobody built a view for goes to the directory, never to a crash */
  if (!ROOM_VIEWS[name]) return show('rooms');
  roomKey = name;
  const s = screens.room;
  s.innerHTML = ROOM_VIEWS[name]();
  wireRoom(s, name);

function featureRows(room, label) {
  const fs = featuresIn(room);
  if (!fs.length) return '';
  return `<div class="eyebrow" style="padding:14px 4px 2px">${label || 'On the canvas, from here'}</div>` +
    fs.map((f) => `<button class="row" data-feat="${f.id}"><span class="grow">
      <span class="n">${esc(f.n)}</span><span class="s">${esc(f.d)}</span></span>
      <span class="chev">›</span></button>`).join('');
}

function wireRoom(s, name) {
  $$('[data-back]', s).forEach((b) => b.addEventListener('click', () => show('rooms')));
  $$('[data-go="board"]', s).forEach((b) => b.addEventListener('click', () => show('board')));
  $$('[data-feat]', s).forEach((b) => b.addEventListener('click', () => APP.openFeature && APP.openFeature(b.dataset.feat)));

  $$('[data-task]', s).forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.task;
    db.done[id] = !db.done[id];
    buzz(10);
    push('todo', { id, done: !!db.done[id] });
    openRoom(name); paintWidget();
    toast(db.done[id] ? 'done — it ticks on her widget too' : 'back on the list');
  }));
  $$('[data-sub]', s).forEach((b) => b.addEventListener('click', () => openSub(b.dataset.sub)));
  $$('[data-dep]', s).forEach((b) => b.addEventListener('click', () => {
    db.savings.have += +b.dataset.dep; push('savings', { have: db.savings.have });
    buzz(12); openRoom(name); toast('€' + b.dataset.dep + ' in. Split by what each can give.');
  }));
  $$('[data-mood]', s).forEach((b) => b.addEventListener('click', () => {
    db.mood = +b.dataset.mood; push('mood', { n: db.mood }); buzz(10); openRoom(name);
    toast(db.pub.mood ? 'she’ll see the weather change' : 'kept private — no gap shown');
  }));
  $$('[data-sw="armour"]', s).forEach((b) => b.addEventListener('click', () => {
    db.armour = !db.armour; push('armour', { on: db.armour }); openRoom(name);
    toast(db.armour ? 'armoured — only “leaving now” breaks through' : 'armour off');
  }));
}

/* ============================================== the widget deck — 21b/21c */

/* 21c: leaving now → live drawing → must-dos → notices → week → quiet.
   Cards are built fresh each paint so the deck reflects the board exactly. */
function deck() {
  const cards = [];
  const add = (pri, c) => cards.push(Object.assign({ pri }, c));
  const partnerLive = APP.partnerDrawing && APP.partnerDrawing();
  const strokeN = APP.strokeCount ? APP.strokeCount() : 0;

  if (db.pub.leave && db.leaving)
    add(1, { kind: 'leave', tint: 'var(--ink)', head: db.leaving.mins + ' min',
      foot: 'leaving now', render: leaveCard });

  const hersN = (APP.hersCount && APP.hersCount()) || 0;
  if (db.pub.trace && (partnerLive || ((strokeN + hersN) && !db.traceSeen)))
    add(2, { kind: 'trace', tint: 'var(--red)', head: partnerLive ? 'drawing' : 'a trace',
      foot: 'trace · one-time', spark: sparkline('var(--red)'), render: traceCard });

  /* a fresh tap is the warmest thing on the deck, so it sits behind only
     "leaving now" and the live trace — it ages out after ten minutes */
  const freshTap = db.thinking && (Date.now() - db.thinking.ts) < 6e5;
  if (freshTap)
    add(3, { kind: 'think', tint: 'var(--red)', head: 'thinking of you',
      foot: 'tapped your name', render: thinkCard });

  const open = db.tasks.filter((t) => !db.done[t.id]);
  if (db.pub.list && open.length)
    add(5, { kind: 'todo', tint: 'var(--ink)', head: open.length + ' left',
      foot: 'today’s list', render: todoCard });

  if (db.shopping && db.pub.list)
    add(4, { kind: 'shop', tint: 'var(--ink)', head: (db.items.length - count(db.got)) + ' left',
      foot: 'groceries · he’s at the shop', render: shopCard });

  if (db.pub.notice && db.notices.length)
    add(7, { kind: 'notice', tint: 'var(--ink)', head: db.notices[0].when,
      foot: 'notice', render: noticeCard });

  if (db.pub.cal && db.week.items.length)
    add(8, { kind: 'week', tint: 'var(--red)', head: db.week.dow + ' ' + db.week.day,
      foot: 'this week', render: weekCard });

  for (const fn of EXTRA_CARDS) { const c = fn(db); if (c) add(c.pri, c); }

  if (!cards.length)
    add(99, { kind: 'quiet', tint: 'var(--ink-2)', head: 'Nothing today',
      foot: 'quiet day', render: quietCard });

  /* 21c's order, as a number — so the flare (0) outranks even "leaving now" */
  return cards.sort((a, b) => a.pri - b.pri);
}

const sparkline = (c) => `<svg viewBox="0 0 90 24" style="width:100%;height:24px">` +
  `<path d="M4 16 C24 4,40 22,86 8" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

function traceCard(b, live) {

  return { ink: true, cap: 'One-time trace · fades once you’ve seen it · tap to join' };
}
function todoCard(b) {

  const oneDone = db.tasks.find((t) => db.done[t.id]);

    open.map((t) => `<div class="w-row"><span class="w-tick"></span><span>${esc(t.title)}</span></div>`).join('') +
    (oneDone ? `<div class="w-row"><span class="w-tick done">✓</span><span class="off">${esc(oneDone.title)}</span></div>` : '');

}
function noticeCard(b) {

    `<div class="w-note">${esc(n.t)} <span style="color:var(--amber)">${esc(n.when)}</span></div>`;

let widIdx = 0, rotate = null, deckTouched = 0;
/* an arrival goes to the front and gets its full dwell — the rotation
   must not slide it away half a second later */
function resetDeck() { widIdx = 0; deckTouched = Date.now(); }
function paintWidget() {
  const cards = deck();
  if (widIdx >= cards.length) widIdx = 0;
  const c = cards[widIdx];
  const body = $('#widget-body'), ink = $('#widget-ink'), cap = $('#widget-cap'), dots = $('#widget-dots');
  if (!body) return;
  const live = APP.partnerDrawing && APP.partnerDrawing();
  const out = c.render(body, live) || {};
  ink.classList.toggle('hidden', !out.ink);
  if (out.ink && APP.paintWidgetInk) APP.paintWidgetInk(ink);
  cap.textContent = out.cap || '';
  cap.classList.toggle('hidden', !out.cap);
  dots.innerHTML = cards.map((_, n) => `<span class="${n === widIdx ? 'on' : ''}"></span>`).join('');
  $('#widget').dataset.card = c.kind;
}

function cycleWidget() {
  const cards = deck();
  const c = cards[widIdx % cards.length];
  /* the live-trace card says "tap to join" — so it opens the app instead */
  if (c.kind === 'trace') {
    db.traceSeen = true; save();
    return APP.showApp && APP.showApp();
  }
  widIdx = (widIdx + 1) % cards.length;
  buzz(6); paintWidget();
}
