/* the room screens are built lazily, the light ones eagerly */
renderRooms(); renderBoard(); renderStates(); renderRules();
show('canvas');

/* keep the canvas headline and the widget honest */
function refresh() {
  const n = APP.strokeCount ? APP.strokeCount() : 0;
  const hands = APP.handCount ? APP.handCount() : 1;
  const cc = $('#canvas-count');
  if (cc) cc.textContent = `${n} mark${n === 1 ? '' : 's'}, ${hands} hand${hands === 1 ? '' : 's'}`;
  const home = $('#home');
  if (home && !home.classList.contains('hidden')) paintWidget();
}
setInterval(refresh, 700); refresh();
paintWidget();
rotate = setInterval(() => {
  const home = $('#home');
  if (window.TRACE_LOWPOWER) return;   // battery saver: the card holds still
  if (Date.now() - deckTouched < 5000) return;
  if (home && !home.classList.contains('hidden') && deck().length > 1) {
    widIdx = (widIdx + 1) % deck().length; paintWidget();
  }
}, 6000);

/* receive the other side's board changes over the same channel as ink */
const seenTs = {};   // per-key last-write-wins — the offline merge rule
window.TRACE_BOARD = {
  receive({ kind, payload, ts }) {
    if (ts && payload && payload.id) {
      const k = kind + ':' + payload.id;
      if (seenTs[k] && seenTs[k] > ts) return;   // an older offline echo — drop it
      seenTs[k] = ts;
    }
    if (kind === 'todo') db.done[payload.id] = payload.done;
    else if (kind === 'list') db.got[payload.id] = payload.got;
    else if (kind === 'shopping') db.shopping = payload.on;
    else if (kind === 'mood') db.herMood = payload.n;
    else if (kind === 'savings') db.savings.have = payload.have;
    else if (kind === 'leaving') db.leaving = payload;
    else if (kind === 'thinking') db.thinking = { ts: Date.now() };
    else if (kind === 'notice') db.notices = [{ id: 'say', t: payload.t, when: 'just now' }]
      .concat(db.notices.filter((n) => n.id !== 'say'));
    else if (kind === 'flare') db.flare = { ts: Date.now() };
    else if (kind === 'pageink') { window.TRACE_APP && TRACE_APP.receivePageInk(payload); db.traceSeen = false; }
    else if (kind === 'guest') db.guest = payload.on;
    else if (kind === 'car') db.carMode = payload.on;
    else if (kind === 'unblock') db.unblocked[payload.id] = true;
    else if (kind === 'decided') db.decided[payload.id] = !db.decided[payload.id];
    else if (kind === 'load') { const l = (db.load || []).find((x) => x.id === payload.id); if (l) l.who = payload.who; }
    else if (kind === 'rsvp') db.rsvp[payload.id] = payload.v;
    else if (kind === 'renewal') db.cancelled[payload.id] = !db.cancelled[payload.id];
    else if (kind === 'bucket') db.bucket[payload.id] = !db.bucket[payload.id];
    else if (kind === 'week') { if (db.week7 && db.week7[payload.n]) db.week7[payload.n][1] = payload.t; }
    else if (kind === 'stack') db.stack = payload.order;
    else if (kind === 'meal') db.mealIdx = payload.i;
    else if (kind === 'jar') db.jarN = payload.n;
    else if (kind === 'baton') db.baton = payload.on;
    else if (kind === 'dose') db.dosed[payload.id] = !db.dosed[payload.id];
    /* anything that arrives goes to the front of the deck — that's the
       whole arrival moment; it never repeats once it has been seen */
    resetDeck();
    save(); paintWidget();
    if (current === 'room' && roomKey) openRoom(roomKey);
  },
  sendPageInk(payload) { push('pageink', payload); },
  /* the engine tells us a stroke landed, so the one-time trace re-arms */
  inked() { db.traceSeen = false; resetDeck(); save(); paintWidget(); },
  paint: paintWidget,
  /* the registry rooms2.js builds the rest of the design on */
  addSub(kind, title, build) { SUBS[kind] = { title, build }; },
  addNav(kind, go) { NAVS[kind] = go; },
  addRow(room, key, name, sub, right) { (SUBLISTS[room] || (SUBLISTS[room] = [])).push({ key, name, sub, right }); },
  addCard(fn) { EXTRA_CARDS.push(fn); },
  addPresence(fn) { PRESENCE_EXTRAS.push(fn); },
  addScreen(name, render) { RENDERERS[name] = render; },
  subRows,
  addBeyond(label, sub, screen) { BEYOND.push([label, sub, () => show(screen)]); },
  screens, deck, resetDeck,
  defaults(more) { for (const k in more) if (!(k in db)) db[k] = more[k]; save(); },
  openSub, openRoom, show, save, push,
  el, esc, count, tickRow, navRow, swRow,
  ui: { toast, buzz, panel: (t, b) => APP.openPanel && APP.openPanel(t, b) },
  /* "leaving now" and "thinking of you" are pushed, not polled */
  leaving(mins) { db.leaving = { mins }; resetDeck(); push('leaving', { mins }); paintWidget();

window.TRACE_ROOMS = window.TRACE_BOARD;

  return { pri: 0, kind: 'flare', tint: 'var(--red)', head: 'I need you', foot: 'the flare',
    render(b) {
      b.innerHTML = `<div class="w-mid"><div class="w-orb" style="background:radial-gradient(circle at 40% 35%,#FF8A94,var(--red));
        box-shadow:0 0 44px rgba(226,51,67,.7)"></div><b>I need you</b>
        <i>Breaks armour, quiet hours, everything</i></div>`;
      return {};
    } };
});

/* 25c: one number on her widget, no nagging */
R.addCard((d) => {
  const n = d.blocked.filter((b) => b.on === 'Maya' && !d.unblocked[b.id]).length;
  if (!n || !d.pub.list) return null;
  return { pri: 6, kind: 'waiting', tint: 'var(--amber)', head: n + ' waiting', foot: 'blocked on her',
    render(b) {
      b.innerHTML = `<div class="w-kicker" style="color:var(--amber)">Waiting on you</div>
        <div class="w-big">${n} <span style="font-size:13px;font-weight:500;color:var(--ink-3)">things can’t move</span></div>`;
      return { cap: 'One number. No nagging, just visible.' };
    } };
});

/* 23a: guests get a dot, nothing more */
R.addCard((d) => d.guest ? {
  pri: 9, kind: 'guests', tint: 'var(--ink-2)', head: 'guests', foot: 'guest mode',
  render(b) {
    b.innerHTML = `<div class="w-mid"><div style="width:10px;height:10px;border-radius:50%;background:var(--amber)"></div>
      <b>Guests</b><i>The private layer is hidden until midnight</i></div>`;
    return {};
  } } : null);

/* 24c: asleep — the widget dims and stops updating */
R.addCard((d) => d.awake ? null : {
  pri: 10, kind: 'asleep', tint: 'var(--ink-3)', head: 'asleep', foot: 'her state',
  render(b) {
    b.innerHTML = `<div class="w-mid" style="opacity:.55"><div class="w-orb"
      style="background:var(--ink-5);box-shadow:none"></div>
      <b>Maya is asleep</b><i>Your marks are waiting for her</i></div>`;
    return {};
  } });

/* 23f: what she left overnight, once, at your wake time */
R.addCard((d) => {
  if (d.handoffSeen) return null;
  const h = new Date().getHours();
  if (h < 5 || h > 11) return null;
  return { pri: 3.5, kind: 'handoff', tint: 'var(--amber)', head: 'three things', foot: 'while you slept',
    render(b) {
      b.innerHTML = `<div class="w-kicker" style="color:var(--amber)">While you slept</div>
        <div class="w-note">Maya left you three things</div>`;
      return { cap: 'Appears once, at your wake time. Never a notification.' };
    } };
});

R.paint();
})();

</script>

 * Android home and the wall-mounted tablet all render here — and all of them
 * read the same deck() the phone widget reads, so they can never drift from
 * what the board actually says.

const trace = (c, w) => `<svg viewBox="0 0 130 40" style="width:100%;height:${w || 40}px">

/* ----------------------------------------------------- 24a · on your wrist */

}

/* ------------------------------------------------------------------ screen */

const TABS = [
  ['watch', 'Watch', 'Same board, smallest surface', 'Watch faces', watchFaces],
  ['lock', 'Lock', 'Before you unlock anything', 'Lock screens', lockScreens],
  ['android', 'Android', 'Material widgets, resizable', 'Android home', androidHome],
  ['tablet', 'Tablet', 'The one on the kitchen wall', 'The mounted board', tabletBoard],
];

function render() {
  const s = screens.surfaces;
  const cur = TABS.find((t) => t[0] === tab) || TABS[0];
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Every surface</button>
      <button class="icob" data-close>✕</button></div>
    <div class="title"><div class="k">${esc(cur[2])} · <span style="color:var(--amber)">coming with the store build</span></div><div class="v">${esc(cur[3])}</div></div>
    <div class="deck" style="padding:16px 20px 0">
      ${TABS.map(([k, label]) => `<button class="c" data-tab="${k}" style="min-width:0;height:38px;padding:0 16px;
        display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:13px;font-weight:600;
        background:${k === tab ? 'var(--ink)' : 'var(--surface)'};color:${k === tab ? 'var(--emph-ink)' : 'var(--ink)'};
        border:1px solid ${k === tab ? 'transparent' : 'var(--hairline)'}">${label}</button>`).join('')}
    </div>
    <div class="body" style="padding:10px 0 0;gap:0">${cur[4]()}</div>`;

  $$('[data-back]', s).forEach((b) => b.addEventListener('click', () => R.show('board')));
  $$('[data-close]', s).forEach((b) => b.addEventListener('click', () => R.show('rooms')));
  $$('[data-tab]', s).forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab; ui.buzz(8); render();
  }));
  stamp(s);
}

/* the device clocks are real, like every other clock in the sim */
function stamp(s) {
  const d = new Date();
  const t = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  $$('[data-clock]', s).forEach((n) => (n.textContent = t));
  $$('[data-date]', s).forEach((n) =>
    (n.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })));
  $$('[data-date-short]', s).forEach((n) =>
    (n.textContent = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })));
  const cap = s.querySelector('[data-canvascap]');

<script>

 *   1. Permission priming — one iOS prompt, ever, so the primer comes first,
 *      and only at the first moment of received value.
 *   2. The notification taxonomy — what rings, what banners, what stays on
 *      the widget. The flare is locked loud; the widget is locked silent.
 *   3. Your key — account restore without an account: one copyable key that
 *      re-arms the pairing and the board on a new phone.

 *      theatre, the canvas seals into a last chapter, the pocket burns.

(() => {
'use strict';

/* ================= 1 · permission priming — first received value ========= */

const VAPID_PUB = 'BKTgp0RYCDJmgT8i9mQ-sl3EU_YTuvjxCYqhFfCJyPXWznKpjyuWXPqC9idiqri5mnKTyd0mcTOhM-VELJY1uzo';
const PUSH_URL = 'https://doadibyqqdimzzywcglv.supabase.co/functions/v1/push';
const PUSH_KEY = 'sb_publishable_W1K6K6qLY2ftOWNBbdm4hA__B7DpmtJ';
function b64uToBytes(str) {
  const pad = '='.repeat((4 - str.length % 4) % 4);
  const raw = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/'));

async function subscribePush() {
  try {
    const token = window.TRACE_NET && TRACE_NET.token;

R.addSub('key', 'your key', (body) => {

<script>
/* trace — pages and the handwriting keyboard.
 *
 * The model, exactly as the owner stated it:
 *   · US    — one shared canvas, both hands, live. Interactive.
 *   · MINE  — my page. What I draw or write here lands on HER widget as a
 *             one-time trace. Nothing of hers can touch it.
 *   · HERS  — her page, arriving on my side. Read-only: it arrives, I watch.
 *
 * The keyboard: type a line, pick a hand (five script faces + Caveat), see
 * it as written — per-glyph wobble, not a font specimen — and send. On MINE
 * it rides the board channel to her widget; on US it lands on both phones.
 */
(() => {
'use strict';
const R = window.TRACE_ROOMS, APP = window.TRACE_APP;
if (!R || !APP) return;
const { el, esc, ui } = R;
const toast = ui.toast, buzz = ui.buzz;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

/* ------------------------------------------------------- the page pills */

const PAGES = [
  ['us', 'us', 'one canvas, both hands — live'],
  ['mine', 'mine', 'your page — lands on her widget, she can’t touch it'],
  ['hers', 'hers', 'her page — it arrives, you watch'],
];

  ${PAGES.map(([k, label]) => `<button data-page="${k}" style="padding:8px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;border:1px solid transparent;color:var(--ink)">${label}</button>`).join('')}
</div>`);
title.after(pills);

function paintPills() {
  const cur = APP.curPage();
  $$('[data-page]', pills).forEach((b) => {
    const on = b.dataset.page === cur;
    /* red is the selection colour now — the store shot's active pill is a red

    b.style.background = on ? 'var(--red-wash)' : 'var(--surface)';

  if (k) k.textContent = cur === 'us' ? 'Today’s canvas' : (cur === 'mine' ? 'Your page' : 'Her page');

  if (note) { note.textContent = cur === 'us' ? '' : page[2]; if (cur !== 'us') setTimeout(() => { if (APP.curPage() === cur) note.textContent = ''; }, 3600); }
}
$$('[data-page]', pills).forEach((b) => b.addEventListener('click', () => {
  APP.setPage(b.dataset.page); buzz(6); paintPills();

  .then(() => { const rd = window.TRACE_APP; rd && rd.paintWidgetInk && R.paint(); });

  style="font:700 15px 'Caveat',cursive">Aa</button>`);

}

    padding:14px 16px;display:flex;flex-direction:column;gap:11px;flex:none">
    <input id="wp-in" placeholder="good morning…" maxlength="40" autocomplete="off"
      style="padding:14px 16px;border-radius:16px;border:1px solid var(--hairline);
      background:var(--surface);color:var(--ink);font:17px inherit;outline:none">
    <div style="border-radius:18px;background:var(--red-wash);border:1px solid var(--red-line);padding:14px 16px">
      <div style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-text)">Rendered in your hand</div>
      <div id="wp-prev" style="min-height:44px;margin-top:8px;overflow:hidden;word-break:break-word;
        font:700 ${size}px '${font}',cursive;color:var(--ink);line-height:1.15"></div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none" id="wp-fonts">
      ${FONTS.map(([f, d]) => `<button data-font="${f}" title="${d}" style="flex:none;padding:7px 14px;
        border-radius:999px;font:600 16px '${f}',cursive;color:var(--ink);border:1px solid var(--hairline);
        background:var(--surface)">${f === 'Caveat' ? 'trace' : 'trace'}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);width:32px">size</span>
      <input id="wp-size" type="range" min="20" max="56" step="2" value="${size}" style="flex:1;accent-color:var(--red);min-width:0">
      <button id="wp-send" style="padding:12px 24px;border-radius:999px;background:var(--red);color:var(--on-red);
        font-size:15px;font-weight:600">Send</button>
    </div>
  </div>`);
  const dock = $('#dock');
  dock.before(pad);
  dock.style.display = 'none';
  $('#sc-canvas').classList.add('composing');

  const input = $('#wp-in', pad), prev = $('#wp-prev', pad);
  const wobble = () => {
    const t = input.value || 'good morning';
    /* the preview wobbles per glyph, same idea as the canvas renderer */
    prev.innerHTML = [...t].map((ch, i) =>
      `<span style="display:inline-block;transform:rotate(${((i * 37 % 11) - 5) * .8}deg) translateY(${((i * 53 % 7) - 3) * .8}px);
        font:inherit">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
    prev.style.font = `700 ${size}px '${font}',cursive`;
  };
  wobble();
  input.addEventListener('input', wobble);
  input.focus();
  $$('#wp-fonts [data-font]', pad).forEach((b) => b.addEventListener('click', () => {
    font = b.dataset.font; buzz(6); wobble();
    $$('#wp-fonts [data-font]', pad).forEach((x) => x.style.borderColor =
      x === b ? 'var(--red)' : 'var(--hairline)');
  }));
  $('#wp-size', pad).addEventListener('input', (e) => { size = +e.target.value; wobble(); });
  const send = () => {
    const t = input.value.trim();
    if (!t) { input.focus(); return; }
    APP.addTextStroke(t, font, size, undefined);
    buzz(12); closePad();
  };
  $('#wp-send', pad).addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
}
keysBtn.addEventListener('click', openPad);
$('#canvas-wrap').addEventListener('pointerdown', closePad);

/* ------------------------------------------------------------- the sim */

const simActions = $('.sim-actions');
if (simActions) {
  const b = el(`<button>she draws on her page</button>`);
  b.addEventListener('click', () => {
    /* a little heart, normalized — exactly what the wire would carry */
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const t = (i / 30) * Math.PI * 2;
      pts.push([+(0.5 + 0.16 * Math.pow(Math.sin(t), 3) * 1.4).toFixed(4),
                +(0.42 - 0.13 * (Math.cos(t) - .45 * Math.cos(2 * t) - .2 * Math.cos(3 * t))).toFixed(4), 1]);
    }
    APP.receivePageInk({ pts, c: 'red', w: 8, alpha: 1, taper: true, brush: 'pen' });
    R.db.traceSeen = false; R.resetDeck(); R.save(); R.paint();
    toast('her page reached your widget');
  });
  simActions.appendChild(b);
  const b2 = el(`<button>she writes in her hand</button>`);
  b2.addEventListener('click', () => {
    APP.receivePageInk({ pts: [], text: 'miss you', font: 'Parisienne', size: 40, x: .2, y: .4, c: 'red' });
    R.db.traceSeen = false; R.resetDeck(); R.save(); R.paint();
    toast('“miss you”, in her hand, on your widget');
  });
  simActions.appendChild(b2);
}
})();

</script>
<script>
/* trace — the two canvas rituals: goodnight (p3) and the prompt deck (p4).
 *
 * These are the other half of build-order step one. p2 gives the day a
 * surface; p3 gives it an ending, and p4 gives it a way to start. Without a
 * seal a shared canvas becomes an infinite scroll of guilt; without a prompt
 * most nights die on the blank page.
 */
(() => {
'use strict';
const R = window.TRACE_ROOMS, APP = window.TRACE_APP;
if (!R || !APP) return;
const { el, esc, ui, screens, show, db, save } = R;
const toast = ui.toast, buzz = ui.buzz;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

R.defaults({
  sealAt: '23:30',        /* per-couple, set once, changeable */
  sealedOn: null,         /* the date string of the last seal */
  streak: 41,
  promptIdx: 0,
  promptOrder: null,
  pinnedPrompt: null,     /* {text, day} — a caption for today only */
});

/* --------------------------------------------------------- the two screens */

for (const id of ['goodnight', 'prompt']) {
  const sec = document.createElement('section');
  sec.className = 'scr hidden';
  sec.id = 'sc-' + id;
  $('#stack').appendChild(sec);
  screens[id] = sec;
}

const today = () => new Date().toDateString();

/* ------------------------------------------------------------ p3 goodnight */

/* Seal time is a wall clock, so the countdown has to survive midnight: if
   tonight's seal has already passed, the next one is tomorrow's. */
function untilSeal() {
  const [h, m] = (db.sealAt || '23:30').split(':').map(Number);
  const t = new Date(); t.setHours(h, m, 0, 0);
  let ms = t - Date.now();
  if (ms < 0) ms += 864e5;
  return ms;
}
function clock(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const hh = Math.floor(total / 3600), mm = Math.floor(total / 60) % 60, ss = total % 60;
  return hh ? `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`
            : `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}
/* the p2 stat card wants the same number, rounded to something human */
function coarse(ms) {
  const mins = Math.max(0, Math.round(ms / 6e4));
  return mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
}

function renderGoodnight() {
  const s = screens.goodnight;
  const sealed = db.sealedOn === today();
  const marks = APP.strokeCount();
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Tonight</button>
      <button class="icob" data-close>✕</button></div>
    <div style="text-align:center;padding:44px 24px 0;flex:none">
      <div style="font-size:15px;color:var(--ink-2)">${sealed ? 'Tonight’s canvas is sealed' : 'Tonight’s canvas seals in'}</div>
      <div id="gn-count" style="font-size:60px;font-weight:700;letter-spacing:-.02em;color:var(--red);margin-top:6px;
        font-variant-numeric:tabular-nums">${sealed ? '—' : clock(untilSeal())}</div>
    </div>
    <div style="margin:32px 56px 0;height:240px;border-radius:24px;background:var(--surface);
      border:1px solid var(--hairline);position:relative;overflow:hidden;flex:none">
      <canvas id="gn-ink" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <div style="position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--ink-3)">
        ${marks} mark${marks === 1 ? '' : 's'} today</div>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 20px 20px;flex:none">
      ${sealed
        ? `<div style="font-size:13px;color:var(--ink-3)">Sealed. It lives in Memory now.</div>
           <div class="btn-plain" data-memory>${db.streak} days of you two</div>`
        : `<div style="font-size:13px;color:var(--ink-3)">Maya already said hers</div>
           <button class="btn-red" data-seal>Say goodnight</button>`}
      <button data-time style="font-size:13px;color:var(--ink-3);text-decoration:underline;
        text-underline-offset:3px">Seals at ${esc(db.sealAt)}</button>
    </div>`;

  const cv = $('#gn-ink', s);
  if (cv) requestAnimationFrame(() => APP.paintWidgetInk(cv));

  $$('[data-back],[data-close]', s).forEach((b) => b.addEventListener('click', () => show('canvas')));
  $$('[data-memory]', s).forEach((b) => b.addEventListener('click', () => R.openRoom('Memory')));
  $$('[data-seal]', s).forEach((b) => b.addEventListener('click', seal));
  $$('[data-time]', s).forEach((b) => b.addEventListener('click', pickSealTime));
}

function seal() {
  db.sealedOn = today();
  /* Streak counts the night either of you sealed, and a missed night pauses
     it rather than resetting — there is no version of this product where the
     app tells you that you broke something. */
  db.streak += 1;
  save();
  R.push('seal', { on: db.sealedOn, streak: db.streak });
  window.TRACE_SEALED = true;
  buzz(14);
  toast('goodnight — the canvas is sealed');
  renderGoodnight();
  paintStat();
}

function pickSealTime() {
  ui.panel('when the day ends', (body) => {
    body.appendChild(el(`<div class="p-note">The canvas seals at this hour and moves to Memory.
      One nudge, if you asked for one — it is off unless you turn it on.</div>`));
    const row = el(`<div class="p-row" style="flex-wrap:wrap"></div>`);
    for (const t of ['21:30', '22:00', '22:30', '23:00', '23:30', '00:00']) {
      const b = el(`<button class="chip" style="text-align:center;flex:0 0 30%">${t}</button>`);
      if (t === db.sealAt) { b.style.borderColor = 'var(--red)'; b.style.background = 'var(--red-wash)'; }
      b.addEventListener('click', () => {
        db.sealAt = t; save(); buzz(8); toast('the day now ends at ' + t);
        APP.closePanel ? APP.closePanel() : null;
        renderGoodnight(); paintStat();
      });
      row.appendChild(b);
    }
    body.appendChild(row);
  });
}

/* the p2 stat card and the live countdown share one timer */
function paintStat() {
  const v = $('#st-goodnight');
  if (v) v.textContent = db.sealedOn === today() ? 'sealed' : coarse(untilSeal());
  const st = $('#st-streak');
  if (st) st.textContent = db.streak + ' days';
  const c = $('#gn-count');
  if (c && db.sealedOn !== today()) c.textContent = clock(untilSeal());
}
setInterval(paintStat, 1000);
paintStat();

/* tapping the countdown card is the way in — it is the only affordance p2
   has for the ritual, and a stat you can't act on is decoration */
const gnCard = $('.stat2 > div');
if (gnCard) {
  gnCard.style.cursor = 'pointer';
  gnCard.addEventListener('click', () => show('goodnight'));
}

/* -------------------------------------------------------- p4 prompt deck */

/* 52, one a week for a year, shipped locally. No server call and no
   personalisation — a prompt that knows things about you is a different,
   worse product. */
const PROMPTS = [
  'Draw the best thing you ate this week',
  'Draw where you were when you first thought about me',
  'Draw the weather inside your head',
  'Draw the thing you almost said today',
  'Draw our kitchen at 7am',
  'Draw what you want Sunday to look like',
  'Draw the last thing that made you laugh',
  'Draw me, badly, on purpose',
  'Draw the room you’d like us to have',
  'Draw what you’re carrying this week',
  'Draw a place we have never been',
  'Draw the sound of the flat when I’m out',
  'Draw the first thing you noticed about me',
  'Draw tonight, if nothing had to be done',
  'Draw the shape of today',
  'Draw something you’ve been putting off',
  'Draw what you’d cook if it were only for you',
  'Draw the view from your desk',
  'Draw a small good thing from this morning',
  'Draw where you go when you go quiet',
  'Draw us in ten years, one line only',
  'Draw the last dream you remember',
  'Draw what you’d take if we left tomorrow',
  'Draw a thing you want to be asked about',
  'Draw the song stuck in your head',
  'Draw how tired you are, as a landscape',
  'Draw the part of the day you look forward to',
  'Draw something we own that should go',
  'Draw the last time you felt properly still',
  'Draw a door you want opened',
  'Draw what you think I’m doing right now',
  'Draw the weather we deserve this weekend',
  'Draw a promise, without words',
  'Draw the smallest thing you’re grateful for',
  'Draw where you’d put a window',
  'Draw the version of you from five years ago',
  'Draw something you want to learn',
  'Draw what home smells like',
  'Draw the argument we no longer have',
  'Draw a plant we would definitely kill',
  'Draw the walk you take when you need to think',
  'Draw what you’d like me to stop worrying about',
  'Draw the meal you want on a bad day',
  'Draw the corner of the house that is yours',
  'Draw a memory you keep going back to',
  'Draw what tomorrow needs from you',
  'Draw the thing you’re proud of and never mention',
  'Draw us, but as animals',
  'Draw the light in the room right now',
  'Draw what you’d do with a free Tuesday',
  'Draw the last kind thing a stranger did',
  'Draw the year, as one line',
];

/* Fisher–Yates over indices, consumed in order and reshuffled at the end —
   a cycle you can finish, so nothing repeats before everything has shown. */
function order() {
  if (!db.promptOrder || db.promptOrder.length !== PROMPTS.length) {
    const a = PROMPTS.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    db.promptOrder = a; db.promptIdx = 0; save();
  }
  return db.promptOrder;
}

function renderPrompt() {
  const s = screens.prompt;
  const o = order();
  const n = db.promptIdx % o.length;
  const text = PROMPTS[o[n]];
  s.innerHTML = `
    <div class="hd"><div class="pill">Prompt deck</div>
      <button class="icob" data-close>✕</button></div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:0 34px">
      <div style="position:relative;width:100%">
        <div style="position:absolute;inset:-8px 10px auto;height:100%;border-radius:26px;
          background:var(--ink-5);opacity:.18;transform:rotate(-3deg)"></div>
        <div style="position:relative;border-radius:26px;background:var(--emph);color:var(--emph-ink);
          padding:36px 30px;min-height:320px;display:flex;flex-direction:column;justify-content:space-between">
          <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--emph-red)">Tonight, together</div>
          <div class="hand" style="font-size:44px;line-height:1.1">${esc(text)}</div>
          <div style="font-size:13px;color:var(--emph-ink-3)">${n + 1} of ${PROMPTS.length} ·
            answers live on the canvas, not in a feed</div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:0 20px 24px;flex:none">
      <button class="btn-plain" data-shuffle>Shuffle</button>
      <button class="btn-red" data-draw>Draw this</button>
    </div>`;
  $$('[data-close]', s).forEach((b) => b.addEventListener('click', () => show('canvas')));
  $$('[data-shuffle]', s).forEach((b) => b.addEventListener('click', () => {
    db.promptIdx = (db.promptIdx + 1) % PROMPTS.length;
    if (db.promptIdx === 0) db.promptOrder = null;      /* cycle done — reshuffle */
    save(); buzz(8); renderPrompt();
  }));
  $$('[data-draw]', s).forEach((b) => b.addEventListener('click', () => {
    db.pinnedPrompt = { text, day: today() };
    save(); buzz(10); show('canvas'); paintPin();
  }));
}

/* The deck's way in is the blank canvas, because the blank canvas is the
   problem it exists for. Once a prompt is pinned it becomes the caption, and
   the moment there is ink it gets out of the way. It never survives the
   night — a prompt is an offer, not a task. */
function paintPin() {
  const w = $('#whisper');
  if (!w) return;
  const pin = db.pinnedPrompt;
  const pinned = pin && pin.day === today();
  const empty = APP.strokeCount() === 0;
  w.textContent = !empty ? '' : pinned ? pin.text : 'Tonight, together — need something to draw?';
  w.classList.toggle('on', empty);
  w.style.pointerEvents = empty && !pinned ? 'auto' : 'none';
  w.style.cursor = 'pointer';
}
setInterval(paintPin, 1200);
const whisper = $('#whisper');
if (whisper) whisper.addEventListener('click', () => { if (APP.strokeCount() === 0) show('prompt'); });

R.addRow('Canvas', 'prompts', 'Prompt deck', () => '52 ways to start a canvas');
R.addNav('prompts', () => show('prompt'));

R.addScreen('goodnight', renderGoodnight);
R.addScreen('prompt', renderPrompt);
renderGoodnight(); renderPrompt();
})();

</script>
<script>
/* trace — the hard parts: repair (p46), cover me (p47), every interruption
 * (p50) and the end (p51).
 *
 * The README puts these before "everything else" for a reason: they are cheap
 * now and expensive to retrofit, and they are the reason anyone trusts the app
 * with the ordinary days. Three of the four are about the app doing *less*.
 *
 * The one piece of architecture here is `quiet` — the README asks for a single
 * "quiet the machinery" switch rather than a conditional per feature, because
 * repair, cover, newborn and grief all want the same silence and a per-feature
 * flag will always miss one.
 */
(() => {
'use strict';
const R = window.TRACE_ROOMS, APP = window.TRACE_APP;
if (!R || !APP) return;
const { el, esc, ui, screens, show, db, save } = R;
const toast = ui.toast, buzz = ui.buzz;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

R.defaults({
  modes: {},              /* repair | cover | newborn | grief | guest | armour | solo | visitor */
  covered: [],            /* task ids handed over */
  loudness: { flare: true, leave: true, agreed: true, goodnight: false },
  ended: null,            /* 'pause' | 'closed' — the app's last state */
});

/* =========================================================== quiet the machinery
 *
 * One switch, four doors. Anything that counts, congratulates, nags or scores
 * asks this before it speaks. Adding a fifth hard mode should not mean editing
 * five features — it should mean adding a name to this list. */

const QUIET_MODES = ['repair', 'cover', 'newborn', 'grief'];
function quiet() { return QUIET_MODES.some((m) => db.modes[m]); }
function quietReason() { return QUIET_MODES.find((m) => db.modes[m]) || null; }
window.TRACE_QUIET = quiet;

function setMode(name, on) {
  db.modes[name] = !!on;
  if (!on) delete db.modes[name];
  save();
  R.push('mode', { name, on: !!on });
  document.documentElement.classList.toggle('is-quiet', quiet());
  window.dispatchEvent(new Event('quietchange'));
  R.paint && R.paint();
}
R.quiet = quiet;
R.setMode = setMode;
document.documentElement.classList.toggle('is-quiet', quiet());

/* the machinery, silenced where it lives rather than at each call site */
window.addEventListener('quietchange', () => {
  const st = $('#st-streak');
  if (st) st.style.opacity = quiet() ? .35 : 1;
});

/* ---------------------------------------------------------------- screens */

for (const id of ['repair', 'cover', 'interrupt', 'theend']) {
  const sec = document.createElement('section');
  sec.className = 'scr hidden';
  sec.id = 'sc-' + id;
  $('#stack').appendChild(sec);
  screens[id] = sec;
}
const back = (s, to) => $$('[data-back],[data-close]', s).forEach((b) =>
  b.addEventListener('click', () => show(to || 'rooms')));

/* =================================================================== p46 repair
 *
 * The screen is mostly an absence. Nothing here asks what happened, scores it,
 * or writes it down — the three things a product is most tempted to do with a
 * fight, and the three that would make the app unsafe to keep open. */

function renderRepair() {
  const s = screens.repair;
  s.dataset.ground = 'alt';
  const on = !!db.modes.repair;
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Repair</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
    <div class="head" style="padding-top:34px">
      <div class="k">Somebody said it first</div>
      <div class="h">We’re not okay right now</div>
      <div class="l">Trace has gone quiet. No streaks, no missions, no prompts, no cheerful
        anything — until one of you comes back.</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:26px 0 0;flex:none">
      <svg viewBox="0 0 200 90" style="width:200px;height:90px">
        <path d="M14 34 C40 10,58 52,86 26" stroke="var(--ink)" stroke-width="6"
          fill="none" stroke-linecap="round"></path>
        <path d="M114 62 C142 38,160 80,186 56" stroke="var(--red)" stroke-width="6"
          fill="none" stroke-linecap="round"></path>
      </svg>
      <div style="font-size:12px;color:var(--ink-4)">two marks, not touching</div>
    </div>
    <div class="stackcol">
      <button class="card" data-act="line"><div class="t">Leave a line, don’t discuss it</div>
        <div class="d">One drawing. No reply expected tonight.</div></button>
      <button class="card" data-act="sleep"><div class="t">Sleep on it — ask me tomorrow at 9</div>
        <div class="d">Trace will bring it up once, gently, then drop it.</div></button>
      <button class="card ink" data-act="ready"><div class="t">I’m ready to talk</div>
        <div class="d">She sees it only when she opens the app. Never a buzz.</div></button>
    </div>
    <div class="spacer"></div>
    <div style="padding:0 20px;flex:none">
      <div class="note">Trace never asks what happened, never scores it, never remembers it in
        the journal. The day just goes quiet.</div>
    </div>
    <div style="padding:14px 20px 10px;flex:none">
      <button class="${on ? 'btn-plain' : 'btn-red'}" data-toggle>${on ? 'We’re alright now' : 'Go quiet'}</button>
    </div>
    <div class="foot">Either of you can end it. Nobody has to apologise to a phone.</div>
    </div>`;
  back(s);
  $$('[data-toggle]', s).forEach((b) => b.addEventListener('click', () => {
    setMode('repair', !db.modes.repair);
    buzz(10);
    toast(db.modes.repair ? 'the app has gone quiet' : 'welcome back');
    renderRepair();
  }));
  $$('[data-act]', s).forEach((b) => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (!db.modes.repair) setMode('repair', true);
    if (a === 'line') { show('canvas'); toast('one line. no reply expected.'); }
    if (a === 'sleep') { db.repairAsk = Date.now() + 864e5; save(); toast('once tomorrow, then dropped'); renderRepair(); }
    /* "ready" is deliberately not a notification — it waits on her side */
    if (a === 'ready') { R.push('repair-ready', {}); toast('she’ll see it when she opens the app'); }
    buzz(10);
  }));
}

/* =============================================================== p47 cover me
 *
 * The interesting part is the fourth row. Trace can move what it owns and
 * nothing else, so work stays put and says so — a handover screen that
 * pretended to cancel a board meeting would be lying about the one thing the
 * person is anxious about. */

function coverables() {
  const open = db.tasks.filter((t) => !db.done[t.id] && t.who !== 'Maya');

/* ========================================================= p50 interruptions
 *
 * Four things, listed where anyone can count them. The flare has no toggle
 * because a flare you can mute is not a flare; the other three do, and
 * goodnight ships off. */

const INTERRUPTS = [
  { id: 'flare', t: 'The flare', d: '3 a year · breaks everything, by design', fixed: true },
  { id: 'leave', t: 'Leaving now', d: 'Only when someone starts moving home' },
  { id: 'agreed', t: 'A reminder you both agreed to', d: 'Never one person’s idea alone' },
  { id: 'goodnight', t: 'Goodnight, if you want it', d: 'One nudge at your hour · off by default' },
];

function renderInterrupt() {
  const s = screens.interrupt;
  const L = db.loudness;
  const silenced = !L.leave && !L.agreed && !L.goodnight;
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Interruptions</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
    <div class="head">

    </div>

        ? `<div class="card ink" style="display:flex;align-items:center;gap:14px">
             <span style="flex:1"><span class="t">${i.t}</span><div class="d">${i.d}</div></span>
             <span style="font-size:12px;font-weight:700;color:var(--emph-red)">always</span></div>`
        : `<button class="card" data-loud="${i.id}" style="display:flex;align-items:center;gap:14px">
             <span style="flex:1"><span class="t">${i.t}</span><div class="d">${i.d}</div></span>
             <span class="sw${L[i.id] ? ' on' : ''}"><i></i></span></button>`).join('')}

    <div class="eyebrow">Never notifies · ever</div>
    <div style="padding:0 20px;flex:none">

    <div class="spacer"></div>
    <div class="actions">
      <button class="btn-ink" data-silence>${silenced ? 'Turn the three back on' : 'Silence everything but the flare'}</button>
    </div>
    </div>`;
  back(s);
  $$('[data-loud]', s).forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.loud; L[k] = !L[k]; save(); buzz(8); renderInterrupt();
  }));
  $$('[data-silence]', s).forEach((b) => b.addEventListener('click', () => {
    const next = silenced;
    L.leave = L.agreed = next; L.goodnight = false;
    save(); buzz(10);
    toast(next ? 'back on — except goodnight' : 'only the flare can reach you now');
    renderInterrupt();
  }));
}

/* ==================================================================== p51 the end
 *
 * Written on day one, before there were users. Everything here is a promise
 * the code has to be able to keep, which is why the archive is "both keep"
 * rather than "primary account holder keeps". */

const ENDINGS = [
  ['Every canvas, full quality', 'both keep'],
  ['Chapters &amp; the printed book', 'both keep'],
  ['The gratitude jar', 'opens early', true],
  ['Your pocket', 'deleted, unread'],
];

function renderEnd() {
  const s = screens.theend;
  s.dataset.ground = 'alt';
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>The end</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
    <div class="head" style="padding-top:26px">
      <div class="k">If it ends</div>
      <div class="h sm">Everything is yours to take</div>
      <div class="l">We wrote this screen on day one, before we had users. An app that holds a
        relationship has to say what happens when the relationship stops.</div>
    </div>
    <div style="padding:18px 20px 0;flex:none">
      <div class="sheet">
        ${ENDINGS.map(([k, v, red]) => `<div class="r"><span class="k">${k}</span>
          <span class="v${red ? ' red' : ''}">${v}</span></div>`).join('')}
      </div>
    </div>
    <div class="eyebrow">Three ways to close it</div>
    <div class="stackcol" style="padding-top:0">
      <button class="card" data-end="pause"><div class="t">Pause</div>
        <div class="d">Everything freezes. Nothing deletes. Come back any time.</div></button>
      <button class="card" data-end="closed"><div class="t">Close the book</div>
        <div class="d">Both get the full archive. The canvas stops. No last message.</div></button>
      <button class="card ink" data-end="died"><div class="t">If one of you dies</div>
        <div class="d">The other keeps everything, forever, free. Named person can be added.</div></button>
    </div>
    <div class="spacer"></div>
    <div class="foot">No hostage-taking, no export fee, no “are you sure” three times.</div>
    </div>`;
  back(s);
  /* One confirm, in place, and it says what it does. The frame's own footer
     rules out the three-modal exit ramp, so the button becomes the ramp. */
  $$('[data-end]', s).forEach((b) => b.addEventListener('click', () => {
    const kind = b.dataset.end;
    if (kind === 'died') { openLegacy(); return; }
    const t = $('.t', b);
    if (!b.dataset.armed) {
      b.dataset.armed = '1';
      b.style.borderColor = 'var(--red)';
      t.textContent = kind === 'pause' ? 'Tap again to pause everything' : 'Tap again — both archives are sent first';
      setTimeout(() => { if (b.isConnected && b.dataset.armed) renderEnd(); }, 5000);
      return;
    }
    db.ended = kind; save(); R.push('ended', { kind }); buzz(16);
    toast(kind === 'pause' ? 'paused. nothing was deleted.' : 'closed. the archive is on its way to you both.');
    renderEnd();
  }));
}

function openLegacy() {
  ui.panel('a named person', (body) => {
    body.appendChild(el(`<div class="p-note">If one of you dies, the other keeps every canvas,
      chapter and jar entry, forever, at no cost. You can also name someone who may be given a
      copy — a parent, a sibling, a child.</div>`));
    const inp = el(`<input placeholder="their name and email" style="padding:14px 16px;border-radius:16px;
      border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font:15px inherit;outline:none">`);
    inp.value = db.legacy || '';
    body.appendChild(inp);
    const b = el(`<button class="p-cta">Save</button>`);
    b.addEventListener('click', () => { db.legacy = inp.value.trim(); save(); toast('saved on this phone'); });
    body.appendChild(b);
    body.appendChild(el(`<div class="p-hint">Nothing is sent to them now, and they are never told.</div>`));
  });
}

/* ------------------------------------------------------------------ wiring */

R.addScreen('repair', renderRepair);
R.addScreen('cover', renderCover);
R.addScreen('interrupt', renderInterrupt);
R.addScreen('theend', renderEnd);
window.addEventListener('quietchange', renderRepair);

R.addBeyond('Repair', 'When you’re not okay — the app goes quiet', 'repair');

R.addBeyond('Every interruption', 'The four things that can ping you', 'interrupt');
R.addBeyond('If it ends', 'Pause, close the book, or outlive it', 'theend');

renderRepair(); renderCover(); renderInterrupt(); renderEnd();
})();

        <div class="card" style="border-radius:22px;padding:18px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-size:13px;color:var(--ink-3);flex:1">Saved</span>
            <span style="font-size:22px;font-weight:700;color:var(--red-text)">€${t.have.toLocaleString()}</span>
            <span style="font-size:13px;color:var(--ink-3)">of €${t.goal.toLocaleString()}</span>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:10px">€${t.weekly}/week keeps you on track.</div>
        </div>
      </div>
      <div class="eyebrow">Before you go</div>
      <div class="stackcol" style="padding-top:0">
        ${prep.map((p) => p.warn
          ? `<div class="card line warn" style="border-radius:16px;padding:13px 16px">
               <span class="grow"><span class="t" style="font-size:15px;font-weight:600">${esc(p.t)}</span>
                 <span class="d">${esc(p.s)}</span></span>
               <button class="end red" data-prep="${p.id}">${p.end}</button></div>`
          : `<button class="card line" style="border-radius:16px;padding:13px 16px" data-prep="${p.id}">
               <span class="tick${db.tripPrep[p.id] ? ' on' : ''}" style="width:22px;height:22px;font-size:11px">${db.tripPrep[p.id] ? '✓' : ''}</span>
               <span class="grow" style="font-size:15px">${esc(p.t)}</span></button>`).join('')}
      </div>
      <div class="eyebrow">While you’re apart</div>
      <div style="padding:0 20px;flex:none">
        <div class="card ink"><div class="t">Two clocks, one canvas</div>
          <div class="d">Her hours show on your side so nobody draws into an empty room at 4 AM.</div></div>
      </div>
      <div class="spacer"></div>
      <div class="foot">Money moves only when you both say so.</div>
    </div>`;
  back(s);
  $$('[data-prep]', s).forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.prep;
    if (k === 'passport') { toast('renewal takes 6 weeks — that’s the deadline, not the trip'); buzz(8); return; }
    db.tripPrep[k] = !db.tripPrep[k]; save(); buzz(8); renderTrip();
  }));
}

/* ========================================================= p44 anniversaries
 *
 * The nearest date is an ink card with a red button into the pocket, because
 * the planning for someone's birthday is the one thing that must not sync. */

function renderDates() {
  const s = screens.dates;
  const soon = db.dates.find((d) => d.soon) || db.dates[0];
  const rest = db.dates.filter((d) => d !== soon);
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Dates</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
      ${head('Dates that matter', 'Nobody forgets alone')}
      <div style="padding:18px 20px 0;flex:none">
        <div class="card ink" style="border-radius:22px;padding:20px 22px">
          <div class="lbl">In 13 days</div>
          <div style="font-size:26px;font-weight:700;margin-top:8px">Maya’s birthday</div>
          <div class="d" style="margin-top:6px">Planning lives in your pocket — she can’t see this.</div>
          <button data-pocket style="width:100%;height:44px;border-radius:999px;background:var(--red);
            color:var(--on-red);font-size:15px;font-weight:600;margin-top:14px">Open the pocket</button>
        </div>
      </div>
      <div class="eyebrow">Coming up</div>
      <div class="stackcol" style="padding-top:0">
        ${rest.map((d) => `
          <div class="card line" style="border-radius:16px;padding:13px 16px">
            <span class="grow"><span class="t" style="font-size:15px;font-weight:600">${esc(d.t)}</span>
              <span class="d">${esc(d.s)}</span></span>
            <span style="font-size:17px;font-weight:700">${esc(d.when)}</span></div>`).join('')}
      </div>
      <div class="spacer"></div>
      <div style="padding:0 20px;flex:none">
        <div class="note">Trace reminds you both, separately, a week out. Neither of you finds out
          the other was reminded.</div>
      </div>
      <div class="foot">Add a date and it belongs to the couple, not to whoever typed it.</div>
    </div>`;
  back(s);
  $$('[data-pocket]', s).forEach((b) => b.addEventListener('click', () => {
    buzz(10); R.openSub ? R.openSub('pocket') : show('rooms');
  }));
}

/* ============================================================== p5 two clocks
 *
 * Long distance, drawn as an arc rather than two digital readouts: the point
 * is the overlap, not the offset. */

function renderClocks() {
  const s = screens.clocks;
  const hers = new Date(Date.now() + 8 * 36e5);   /* the demo partner is +8 */
  const fmt = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Two clocks</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
      <div class="head" style="text-align:center">
        <div class="k">Maya’s evening starts in</div>
        <div class="h" style="font-size:34px">3 hours, 20 minutes</div>
      </div>
      <div style="position:relative;height:190px;margin-top:10px;flex:none">
        <svg viewBox="0 0 360 190" style="position:absolute;inset:0;width:100%;height:100%">
          <path d="M0 165 C90 20, 270 20, 360 165" stroke="var(--ink-5)" stroke-width="2" fill="none"></path>
          <circle cx="98" cy="64" r="9" fill="var(--ink)"></circle>
          <circle cx="252" cy="64" r="9" fill="var(--red)"></circle>
        </svg>
        <div style="position:absolute;left:58px;top:18px;font-size:12px;font-weight:600">You · ${fmt(new Date())}</div>
        <div style="position:absolute;right:38px;top:18px;font-size:12px;font-weight:600;color:var(--red-text)">Maya · ${fmt(hers)}</div>
      </div>
      <div class="stackcol">
        <div class="card"><div class="t">Both awake, 6 hours a day</div>
          <div class="d">18:00–24:00 yours · 10:00–16:00 hers. The canvas is loudest here.</div></div>
        <div class="card"><div class="t">Marks wait, they don’t wake</div>
          <div class="d">Anything you draw while she’s asleep is there when she opens her eyes.</div></div>
        <div class="card"><div class="t">Her widget dims when she sleeps</div>
          <div class="d">So you can tell without asking, and without a location.</div></div>
      </div>
      <div class="spacer"></div>
      <div style="padding:0 20px;flex:none">
        <div class="note">Presence is a dot, never a place. Trace shows that she’s here — never where.</div>
      </div>
      <div class="foot">Two cities, one canvas.</div>
    </div>`;
  back(s);
}

/* ------------------------------------------------------------------ wiring */

R.addScreen('findtime', renderFind);
R.addScreen('newevent', renderNew);
R.addScreen('clash', renderClash);
R.addScreen('trip', renderTrip);
R.addScreen('dates', renderDates);
R.addScreen('clocks', renderClocks);

R.addRow('Household', 'findtime', 'Find us a time', () => 'Windows you’re both free — and awake');
R.addNav('findtime', () => show('findtime'));
R.addRow('Household', 'newevent', 'New event', () => 'Four fields, and what Trace noticed');
R.addNav('newevent', () => show('newevent'));
R.addRow('Household', 'clash', 'A clash', () => 'Three doors, no verdict');
R.addNav('clash', () => show('clash'));
R.addRow('Together', 'trip', 'Trips', () => 'The countdown, the money, the prep');
R.addNav('trip', () => show('trip'));
R.addRow('Memory', 'dates', 'Anniversaries', () => 'Nobody forgets alone');
R.addNav('dates', () => show('dates'));
R.addRow('Canvas', 'clocks', 'Two clocks', () => 'Long distance, drawn as an overlap');
R.addNav('clocks', () => show('clocks'));

/* ========================================================== p36 canvas extras
 *
 * Invariant one says the Canvas row opens the canvas, which leaves the room's
 * quiet corners with nowhere to live. This is that shelf — the frame's four
 * small things, followed by whatever else registers against the Canvas room.
 *
 * All four are on-device by construction: the voice becomes a line and the
 * recording is discarded, the day map is a shape and never coordinates. */

screens.extras = (() => {
  const sec = document.createElement('section');
  sec.className = 'scr hidden'; sec.id = 'sc-extras';
  $('#stack').appendChild(sec);
  return sec;
})();

function renderExtras() {
  const s = screens.extras;
  s.innerHTML = `
    <div class="hd"><button class="pill" data-back>Canvas</button>
      <button class="icob" data-close>✕</button></div>
    <div class="page">
      ${head('Canvas, the quiet corners', 'Four small things')}
      <div class="stackcol">
        <button class="card" data-x="voice"><div class="t">Voice ink</div>
          <div style="display:flex;align-items:center;gap:12px;margin:10px 0">
            <span style="display:flex;align-items:flex-end;gap:3px;height:26px">
              ${[40, 75, 50, 95, 60, 35].map((h) => `<i style="width:3px;height:${h}%;background:var(--ink);display:block"></i>`).join('')}
            </span>
            <span style="font-size:16px;color:var(--ink-5)">→</span>
            <svg viewBox="0 0 140 30" style="width:140px;height:30px">
              <path d="M4 22 C24 4,40 26,62 12 C84 -2,104 24,136 8" stroke="var(--red)"
                stroke-width="4" fill="none" stroke-linecap="round"></path></svg>
          </div>
          <div class="d">A line with your cadence. Never a recording, never text.</div></button>

        <button class="card" data-x="sky"><div class="t">Someone else’s sky</div>
          <div style="display:flex;gap:10px;margin:10px 0">
            <span style="flex:1;height:52px;border-radius:12px;display:flex;align-items:flex-end;padding:6px 10px;
              background:linear-gradient(180deg,#F7D8A8,#E9A13B);font-size:11px;color:#5A3A0E">Her 6:12 AM</span>
            <span style="flex:1;height:52px;border-radius:12px;display:flex;align-items:flex-end;padding:6px 10px;
              background:linear-gradient(180deg,#8E7FA8,#3A3050);font-size:11px;color:rgba(255,255,255,.85)">Your 8:58 PM</span>
          </div>
          <div class="d">Dark at the same time: 5h 10m.</div></button>

        <button class="card" data-x="map"><div class="t">Map of your day</div>
          <div style="display:flex;align-items:center;gap:12px;margin:10px 0">
            <svg viewBox="0 0 150 56" style="width:150px;height:56px">
              <path d="M8 46 C30 10,58 50,84 22 C104 2,124 34,142 14" stroke="var(--ink-5)"
                stroke-width="3" fill="none" stroke-linecap="round"></path>
              <circle cx="8" cy="46" r="5" fill="var(--ink)"></circle>
              <circle cx="142" cy="14" r="5" fill="var(--red)"></circle></svg>
            <span class="hand" style="font-size:20px;color:var(--ink-2);line-height:1.15;font-weight:600">long way home,<br>on purpose</span>
          </div>
          <div class="d">Drawn from your steps. Shared as a shape only.</div></button>

        <div class="card ink"><div class="t">Nothing today</div>
          <div class="d" style="line-height:1.5">That’s allowed. The canvas stays open, nobody is
            asked for anything, and quiet days don’t break a thing.
            ${db.streak || 41} days — still yours.</div></div>
      </div>
      <div class="eyebrow">Also on the canvas</div>
      <div class="stackcol" style="padding-top:0">${R.subRows('Canvas')}</div>
      <div class="spacer"></div>
      <div class="foot">Everything here is read on this phone and stays on it.</div>
    </div>`;
  back(s, 'rooms');
  $$('[data-sub]', s).forEach((b) => b.addEventListener('click', () => R.openSub(b.dataset.sub)));
  $$('[data-x]', s).forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.x; buzz(8);
    if (k === 'voice') toast('hold the canvas to speak — the recording never leaves this phone');
    if (k === 'sky') show('clocks');
    if (k === 'map') toast('a shape, not a route — she never sees where');
  }));
}
R.addScreen('extras', renderExtras);
R.addBeyond('Canvas extras', 'Voice ink · sky · day map · nothing today', 'extras');
renderExtras();

renderFind(); renderNew(); renderClash(); renderTrip(); renderDates(); renderClocks();
})();

</script>
</body>
</html>
